name: Publish to OKE

# Builds NovaForge's images for arm64 on the azrty ARC runners (which run on the
# OKE cluster itself), pushes them to OCIR, and pins the commit tag in
# deploy/helm/novaforge/values-oke.yaml. Kuvryn Sync deploys main, so a green
# main is the deployed state on novaforge.azrty.com.
#
# The kw cluster is unaffected: it is promoted by hand (hack/build-images.sh +
# hack/promote-kw.sh) from images on its own registry.
#
# The pin lands through a pull request, not a push: main requires the "test"
# check, which a direct push cannot carry (GitHub rejects it, GH006). The PR is
# opened with the SDK-bump GitHub App's token rather than GITHUB_TOKEN, because
# a PR opened with GITHUB_TOKEN starts no workflow, so "test" would never report
# and auto-merge would wait forever.
#
# Why that cannot loop: merging a pin changes only values-oke.yaml, and that
# path is ignored below, so a pin is never re-published as if it were new code.
# A values-only change (such as oidc.passwordLoginEnabled) is not published
# either; Sync applies it from main with the images already pinned.
# A commit that changes values-oke.yaml together with code still publishes.

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/helm/novaforge/values-oke.yaml
      # Decision records and prose change no image, but each publish pins a new
      # tag and rolls every OKE pod.
      - ".procoder/**"
      - "**/*.md"
  workflow_dispatch: {}

permissions:
  contents: read

# Two publishes racing would pin out of order; the later commit must win.
concurrency:
  group: publish-oke
  cancel-in-progress: false

env:
  OCIR: dxb.ocir.io/axmcgpqk0w0z/azrty/novaforge-

jobs:
  # The same minimum CI holds main to: a commit that does not build and vet is
  # not published.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...

  image:
    needs: verify
    runs-on: arc-azrtydxb
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        # Every image values-oke.yaml deploys, plus the gate sandbox so it is
        # ready when executable gates are enabled. deployment-runner is not
        # here: the operator builds it from an approved chart archive.
        svc:
          - identity
          - git-platform
          - work-reviews
          - ci-runner
          - gates
          - agent-runtime
          - engineering-graph
          - mcp-server
          - edge
          - runner
          - nf
          - gate-analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner pod's rootless BuildKit sidecar does the build, not dind.
      # BuildKit pushes with the docker CLI's credentials, so the OCIR login
      # below must stay in this job.
      - id: builder
        uses: azrtydxb/.github/actions/setup-builder@d021f2ca9fa3d6682085a7d069b7c8b1dc7b9b80 # main
      - name: Log in to OCIR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dxb.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}
      # hack/dockerfile-for.sh is the one mapping from service to Dockerfile,
      # shared with the in-cluster build, so the two paths cannot diverge.
      - id: df
        run: |
          read -r file target < <(./hack/dockerfile-for.sh "${{ matrix.svc }}")
          echo "file=$file" >>"$GITHUB_OUTPUT"
          echo "target=${target:-}" >>"$GITHUB_OUTPUT"
      - id: short
        run: echo "sha=${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
      # OKE nodes are arm64 and so is this runner: build natively.
      - name: Build and push ${{ matrix.svc }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.builder.outputs.name }}
          context: .
          file: ${{ steps.df.outputs.file }}
          target: ${{ steps.df.outputs.target }}
          build-args: SERVICE=${{ matrix.svc }}
          platforms: linux/arm64
          # main pushes, as always. A workflow_dispatch on another branch only
          # builds, so a CI change can be exercised without publishing images.
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false
          # The commit sha only — never a mutable tag. A mutable tag with
          # IfNotPresent served stale code on kw for a whole session.
          tags: ${{ env.OCIR }}${{ matrix.svc }}:${{ steps.short.outputs.sha }}

  pin:
    needs: image
    # Only main pushed images, so only main has anything to pin.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SDK_BUMP_APP_ID }}
          private-key: ${{ secrets.SDK_BUMP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Open the pin pull request and enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          values=deploy/helm/novaforge/values-oke.yaml
          branch="deploy/pin-oke-${short}"
          git config user.name "novaforge ci"
          git config user.email "ci@novaforge.invalid"
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is no longer on main; not pinning"
            exit 0
          fi
          git checkout --quiet --force -B "$branch" origin/main
          read_tag() { awk '/^image:/{f=1;next} f&&/^  tag:/{print $2;exit} f&&/^[^ ]/{exit}' "$values"; }
          current=$(read_tag)
          # Never move the pin backwards: a slow publish of an older commit
          # finishing after a newer one must not roll OKE back.
          if [ -n "$current" ] && [ "$current" != "$short" ] \
            && git cat-file -e "$current^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$GITHUB_SHA" "$current"; then
            echo "values-oke already pins $current, which contains $short; not pinning"
            exit 0
          fi
          sed -i -E "/^image:/,/^[^ ]/ s|^(  tag: ).*|\1${short}|" "$values"
          if [ "$(read_tag)" != "$short" ]; then
            echo "failed to write tag $short into $values" >&2
            exit 1
          fi
          if git diff --quiet; then
            echo "$values already pins $short"
            exit 0
          fi
          git add "$values"
          git commit --quiet -m "deploy: pin ${short} on oke" \
            -m "Written by CI after the images were pushed to ${OCIR}* (built from ${GITHUB_SHA})."
          git push --quiet --force origin "HEAD:${branch}"
          if [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[].number')" ]; then
            gh pr create --head "$branch" --base main --title "deploy: pin ${short} on oke" \
              --body "Pins the images CI pushed for ${GITHUB_SHA}. Kuvryn Sync deploys main to novaforge.azrty.com once this merges."
          fi
          gh pr merge "$branch" --auto --squash --delete-branch
          # An older pin still open is superseded by this one.
          for old in $(gh pr list --state open --json headRefName -q '.[].headRefName' | sed -n 's|^deploy/pin-oke-||p'); do
            if [ "$old" != "$short" ]; then
              gh pr close "deploy/pin-oke-$old" --delete-branch --comment "Superseded by ${branch}."
            fi
          done
