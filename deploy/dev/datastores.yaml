apiVersion: v1
kind: Namespace
metadata:
  name: novaforge-dev
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pg-data, namespace: novaforge-dev}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: novaforge-dev}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        env:
        - {name: POSTGRES_USER, value: novaforge}
        - {name: POSTGRES_PASSWORD, value: novaforge}
        - {name: POSTGRES_DB, value: novaforge}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
        readinessProbe:
          exec: {command: [pg_isready, -U, novaforge]}
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes: [{name: data, persistentVolumeClaim: {claimName: pg-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: novaforge-dev}
spec:
  type: LoadBalancer
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: novaforge-dev}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["redis-server", "--appendonly", "yes"]
        ports: [{containerPort: 6379}]
        readinessProbe:
          exec: {command: [redis-cli, ping]}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: novaforge-dev}
spec:
  type: LoadBalancer
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: minio-data, namespace: novaforge-dev}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: novaforge-dev}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - {name: MINIO_ROOT_USER, value: minioadmin}
        - {name: MINIO_ROOT_PASSWORD, value: minioadmin}
        ports: [{containerPort: 9000}, {containerPort: 9001}]
        volumeMounts: [{name: data, mountPath: /data}]
        readinessProbe:
          httpGet: {path: /minio/health/live, port: 9000}
          initialDelaySeconds: 10
      volumes: [{name: data, persistentVolumeClaim: {claimName: minio-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: novaforge-dev}
spec:
  type: LoadBalancer
  selector: {app: minio}
  ports: [{name: api, port: 9000, targetPort: 9000}, {name: console, port: 9001, targetPort: 9001}]
