# Image coordinates. Nexus is a push/pull split: images are pushed to the
# :5000 hosted connector but the nodes pull from 443, so the registry written
# into pod specs is the pull address.
image:
  registry: 192.168.10.131
  repository: novaforge
  tag: dev # overridden per deploy with the commit sha; see hack/deploy.sh
  pullPolicy: IfNotPresent # safe because tags are immutable commit shas
  pullSecret: nexus-pull

# Bare repositories must be ReadWriteMany so any git-platform replica can serve
# any repository.
repos:
  storageClass: nfs-v3
  size: 50Gi

datastores:
  enabled: true
  postgres:
    image: pgvector/pgvector:pg16
    storageClass: longhorn
    size: 20Gi
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:latest
    storageClass: longhorn
    size: 20Gi

# Operator-owned RBAC is provisioned separately for GitOps installations.
rbac:
  create: true
storage:
  pruneProtection: false

secrets:
  # With an existing Secret, no credential bytes are rendered by this chart.
  # Also requires POSTGRES_PASSWORD, MINIO_ROOT_USER and MINIO_ROOT_PASSWORD
  # when the bundled datastores are enabled.
  existingSecret: ""
  jwtSecret: "change-me-in-production"
  hmacSecret: "change-me-in-production"
  secretsKek: "change-me-in-production-32byteslong"
  postgresPassword: novaforge
  minioAccessKey: minioadmin
  minioSecretKey: minioadmin

# Model access goes through go-ai-sdk pointed at the cluster's FastLLM proxy,
# so no hosted provider is reachable and air-gapped operation holds.
ai:
  endpoint: "http://fastllm-proxy.fastllm.svc.cluster.local:4000/v1"
  model: "qwen3-6-35b-a3b"
  embedEndpoint: "http://fastllm-proxy.fastllm.svc.cluster.local:4000/v1"
  embedModel: "embed"
  # Bearer token for the proxy. Set with --set ai.apiKey=... at install time.
  apiKey: ""
  # Extra wire parameters this model server needs, merged into every request.
  # A Qwen model behind vLLM keeps its chain-of-thought on unless told not to,
  # and a reasoning model asked for structured output spends its whole token
  # budget thinking and returns nothing decodable — measured on this cluster:
  # 4096 tokens of reasoning, no answer, versus a complete answer in under five
  # seconds with thinking off.
  providerOptions:
    chat_template_kwargs:
      enable_thinking: false
  # Token prices, per model name, in micro-units per million tokens:
  #   qwen3-6-35b-a3b:
  #     input_micros_per_million_tokens: 150000
  #     output_micros_per_million_tokens: 600000
  # A model served on this cluster's own hardware has no list price, so none is
  # set here and none is invented. Without a price for AI_MODEL an Agent Run is
  # bounded by wall clock and tokens, and a request for a cost limit is refused
  # rather than accepted and never reached.
  modelPrices: {}

# Egress for the services that have no business outside the cluster (see
# templates/networkpolicy.tpl). Requires Cilium.
networkPolicy:
  enabled: true
  airGapped:
    - identity
    - git-platform
    - ci-runner
    - agent-runtime
    - engineering-graph
    - mcp-server
    - edge

# The software-factory layer: what the platform does on its own.
factory:
  autoMerge:
    # Off by default. A fresh installation must never merge anything without
    # an explicit opt-in, however green its gates are.
    enabled: false
    # A change above this many files is never auto-merged, whatever its gates
    # say — size is its own kind of risk. 0 means no cap.
    maxFilesChanged: 20
  maintenance:
    # How often the maintenance scanners sweep every repository.
    intervalHours: 24

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "2", memory: 1Gi }

# Operator JSON and referenced credential/CA files live in pre-created Secrets,
# mounted read-only only into their consuming service. Never put secret bytes in
# Helm values. Paths are /etc/novaforge/operator/<key>/<configKey>.
# Empty secretName explicitly leaves the feature unavailable; it is not enabled
# merely by rendering the chart. Directory mounts permit kubelet secret rotation.
operatorConfigs:
  openbao: { secretName: novaforge-openbao, configKey: config.json }
  deployments: { secretName: "", configKey: config.json }
  semanticProducer: { secretName: "", configKey: config.json }
  mcpHTTP: { secretName: "", configKey: config.json }
  reviews: { secretName: "", configKey: config.json }

# The certificate the git transport serves (templates/certificate.tpl). A clone
# or push over the plaintext port sends its credential in the clear, so anything
# outside the cluster must use the TLS port; the plaintext one stays bound for
# in-cluster callers.
#
# cert-manager issues it. `issuer` names a ClusterIssuer the cluster already has
# (cluster-ca here) rather than a self-signed one, so a client can verify the
# chain against one CA instead of pinning a certificate per release.
gitTLS:
  enabled: true
  issuer:
    name: cluster-ca
    kind: ClusterIssuer
  # A client outside the cluster reaches git-platform at its LoadBalancer
  # address, and an address is not covered by a DNS SAN. Either list the
  # address here, or reach it by one of the certificate's names — the deploy
  # e2e does the latter with git's http.curloptResolve, which needs nothing
  # to be known at install time.
  ipAddresses: []
  extraDNSNames: []

# Git LFS. The pointer is committed to the repository and the payload goes to the
# deployment's object storage, so LFS is available exactly when S3_ENDPOINT is
# configured and git-platform says so on the batch endpoint when it is not.
lfs:
  # HTTPS origin advertised by SSH authentication. Empty uses the certificate's
  # in-cluster DNS name; connected deployments should set their reachable origin.
  publicURL: ""
  # The largest single LFS object this deployment accepts, in bytes (5 GiB). An
  # upload declaring more is refused at the batch call, before a byte is sent,
  # and an upload that understates its length is cut off at the same limit.
  #
  # It is deliberately not optional: one unbounded push fills the object storage
  # every organization shares. Removing this value does not lift the limit —
  # internal/gitops falls back to the same 5 GiB — but it does break
  # internal/service's chart test, which is what keeps the variable in the pod.
  maxObjectBytes: 5368709120

# Only services whose binary exists are listed. Entries are added as each
# service's cmd/ package lands, so a deploy never references a missing image.
services:
  identity:
    grpcPort: 9091
    schema: identity
  git-platform:
    grpcPort: 9092
    httpPort: 8081
    # The TLS port for the git transport. It is not free to change: the binary
    # serves gitops.DefaultHTTPSPort, and internal/gitops holds this value to
    # it. See gitTLS below for the certificate it serves.
    httpsPort: 8443
    sshPort: 2222
    schema: gitplatform
    needsRepos: true
    extraServiceType: LoadBalancer
    # A fixed LoadBalancer address (kube-vip), or empty to let the provider
    # choose. Clients outside the cluster dial it, so list it in
    # gitTLS.ipAddresses and lfs.publicURL too.
    loadBalancerIP: ""
  work-reviews:
    grpcPort: 9093
    schema: work
  ci-runner:
    grpcPort: 9094
    schema: ci
  gates:
    grpcPort: 9096
    schema: gates
    # Explicit operator-owned digest. Empty leaves executable gates unavailable.
    # Image contents and sandbox RBAC must be separately qualified; this setting
    # does not grant cluster authority or select a local execution fallback.
    analysisImage: ""
    # The sandbox needs to create its own namespace, network policy and pod.
    sandboxRbac: true
  agent-runtime:
    grpcPort: 9095
    schema: agents
    rbac: true
  engineering-graph:
    grpcPort: 9097
    schema: graph
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { cpu: "2", memory: 2Gi }
  mcp-server:
    grpcPort: 9098
    httpPort: 8084
    schema: mcp
  edge:
    httpPort: 8080
    schema: edge
    extraServiceType: LoadBalancer

# Runners are not in `services`: they expose no port and are never dialled, they
# dial out. A Service in front of one would be an object nothing could use.
runner:
  # Runners register into one organization, because organizations are a hard
  # security boundary and a runner that served every org would be a way across
  # it. There is no organization at install time, so no runner is deployed until
  # orgId is set.
  orgId: ""
  replicas: 2
  labels: ["linux"]
  jobNamespace: novaforge

# Exact operator-approved HTTP(S) destinations for Git import/mirror and webhooks.
# Empty retains closed external egress. Private addresses require private CIDRs.
# Example: [{scheme: https, host: github.com, port: 443, cidrs: [140.82.112.0/20]}]
outbound:
  destinations: []
