# Traceability from backend-platform.md's acceptance criteria to the evidence
# that actually proves them.
#
# The spec names one Go test per criterion. Most of those names were never
# written: the behaviour is proven (or not) by tests with other names and by
# the e2e scripts. Tests are not renamed to match, and no empty test carries a
# criterion's name — this map says where the proof really is, and where it is
# not. internal/spectrace's TestSpecTraceability fails when a criterion is
# missing here, when this file names one the spec does not, when a mapped Go
# test no longer exists, or when a mapped e2e script or step does not.
#
# Coverage was decided by reading the tests, not by their names.
#   covered   every clause of the criterion is asserted somewhere below
#   partial   some clauses are asserted; note says exactly what is not
#   uncovered the behaviour cannot be observed on the deployed platform: the
#             component is tested, but nothing in production calls it (or no
#             test exists at all); note says what is missing
#
# go_tests entries are "<package path> <TestName>". e2e entries name a script
# and the exact text of one of its `echo "== <step> =="` lines.

spec: .procoder/specs/backend-platform.md

criteria:
  S-1/TestRegisterLoginTOTP:
    status: covered
    note: >-
      Clauses are asserted across tests rather than in one flow: TOTP is turned
      on through the enrolment RPCs in one test and written straight to the
      store in the login test; a login with a wrong code (rather than none) is
      not asserted.
    go_tests:
      - ./internal/identity TestLoginRequiresTOTPWhenEnabled
      - ./internal/identity TestTOTPEnrolmentIsTwoStep
      - ./internal/identity TestTOTPKnownVector
      - ./internal/identity TestTOTPWindowTolerance
    e2e:
      - script: tests/e2e/deploy_test.sh
        step: "3. register, log in, create an org and a repo through the API"
      - script: tests/e2e/gui_test.sh
        step: "3. an account can sign in and read what the app reads"

  S-1/TestPATGitClone:
    status: covered
    note: >-
      An unmodified git client clones and pushes over smart-HTTP with a
      personal access token minted through identity, through git-platform's
      real credential adapter (gitops.NewCredentialAuthFunc, formerly
      cmd/git-platform newAuthFunc); after DeleteToken the same clone and
      ls-remote are refused by the transport with an authentication failure.
      The transport is plain HTTP in-process, not HTTPS: TLS terminates in
      front of git-platform, not in it.
    go_tests:
      - ./internal/gitops TestPATGitClone
      - ./internal/identity TestTokenResolve
      - ./internal/identity TestRevokedTokenRejected
      - ./internal/identity TestResolveTokenRejectsRevoked
    e2e:
      - script: tests/e2e/crossorg_test.sh
        step: "4. A cannot clone or push B's repository over smart-HTTP or SSH"

  S-2/TestStandardGitRoundTrip:
    status: covered
    note: >-
      Only the e2e script proves every clause (HTTPS and SSH with an unmodified
      client, then a REST read); the Go tests use stub auth and read back
      through gitops.Repo, not REST.
    go_tests:
      - ./internal/gitops TestCloneAndPushOverHTTP
      - ./internal/gitops TestCloneOverSSH
      - ./internal/gitops TestPushOverSSH
    e2e:
      - script: tests/e2e/deploy_test.sh
        step: "4. a standard git client clones, commits and pushes over HTTPS"
      - script: tests/e2e/deploy_test.sh
        step: "5. the same repository works over SSH"
      - script: tests/e2e/deploy_test.sh
        step: "6. the pushed commit is readable through the REST API"

  S-2/TestRepoBrowseAPI:
    status: covered
    note: >-
      TestRepoBrowseAPI pushes with an unmodified git client (including a
      lightweight and an annotated tag and a slashed agent branch) and reads
      branches, tags, history, trees, blobs and diffs through the real REST
      edge in front of the real git-platform. It found every ref reported with
      kind "commit" and annotated tags reported as their tag-object sha; both
      are fixed in gitops.Repo.refs. The GUI Repos screen lists tags and
      compares two refs; that screen has not been driven in a browser.
    go_tests:
      - ./internal/edge TestRepoBrowseAPI
      - ./internal/gitops TestInitAndBranches
      - ./internal/gitops TestTreeBlobAndDiff
      - ./internal/gitops TestGetBlobUnknownPath
      - ./internal/edge TestRefWithSlashesReachesTheService
    e2e:
      - script: tests/e2e/deploy_test.sh
        step: "6. the pushed commit is readable through the REST API"

  S-3/TestAgentBranchScopeEnforced:
    status: covered
    note: >-
      An agent run's credential (svcauth.MintAgentRun, what agent-runtime
      mints) for an agent whose run StartRun granted agents/<key>/ pushes
      inside the grant and is refused main with the same reason over
      smart-HTTP, over SSH (password authentication accepts only an agent
      credential), and through CreateCommit/Merge — the API git.commit calls —
      all through gitops.NewGrantCapFunc and git-platform's composition. The
      commit tool's own check is proven separately. Not yet exercised on the
      cluster: no e2e pushes as an agent over a transport.
    go_tests:
      - ./internal/gitops TestAgentBranchScopeEnforced
      - ./internal/gitops TestSSHPasswordIsOnlyForAgents
      - ./internal/svcauth TestAgentRunTokenNamesItsAgent
      - ./internal/capability TestWriteBranchScopeEnforced
      - ./internal/capability TestPrefixEscapeDenied
      - ./internal/tools TestGitCommitRefusesOutOfScopeBranch
      - ./internal/gitops TestPushDeniedByCapability
      - ./internal/gitops TestPushOverSSHDeniedByCapability

  S-3/TestCrossOrgAccessDenied:
    status: covered
    note: >-
      Starting from identity-issued sessions, a personal access token and a
      registered SSH key, org A is refused B's repositories (GetRepo, tree,
      blob, diff, tags, branch/commit/delete writes, clone and push over HTTP
      and SSH), Work Items (get, assign, comment, list), Agent Runs (get,
      cancel, event stream, starting a run with B's agent or sponsor), CI
      runs, logs, artifacts and triggers, the runner protocol, and the MCP
      register — both naming B and naming A with B's ids. This found and
      fixed an unauthenticated CI runner protocol (runner registration into
      any org, unverified runner tokens) and StartRun trusting agent and
      sponsor ids. crossorg_test.sh has been written but not yet run on the
      cluster.
    go_tests:
      - ./internal/platformtest TestCrossOrgAccessDenied
      - ./internal/platformtest TestCrossOrgCIDenied
      - ./internal/authz TestRequireOrgRejectsCrossOrg
      - ./internal/identity TestResolveOrgScopeRefusesNonMember
      - ./internal/gitops TestListReposIsOrgScoped
      - ./internal/work TestGetItemDeniedForForeignOrg
      - ./internal/work TestListIsOrgScoped
      - ./internal/work TestCommentsAreOrgScoped
      - ./internal/reviews TestGetRunDeniedForForeignOrg
      - ./internal/reviews TestAddCommentDeniedForForeignOrg
      - ./internal/ci TestClaimNeverCrossesOrganizations
      - ./internal/agents TestListAgentsIsOrgScoped
    e2e:
      - script: tests/e2e/crossorg_test.sh
        step: "3. A cannot read or write B's repository through the REST API"
      - script: tests/e2e/crossorg_test.sh
        step: "5. A cannot reach B's Work Items, runs, Agent Runs, CI or MCP register"

  S-4/TestWorkItemLifecycle:
    status: covered
    note: >-
      TestWorkItemLifecycle goes through the edge's REST handlers to the real
      work service over gRPC on the real database: type, goal, acceptance
      criteria, constraints and required gates are created and read back, an
      unknown required gate is refused, and the item is assigned to a person
      and then to an agent. The services' credential resolution is stood in
      for by a scope-injecting interceptor; the edge's own authentication is
      not part of this test.
    go_tests:
      - ./internal/edge TestWorkItemLifecycle
      - ./internal/work TestCreateWorkItemAllocatesKey
      - ./internal/work TestCreateItemAllocatesKeyOverGRPC
      - ./internal/work TestRejectUnknownType
      - ./internal/work TestAssignToAgent
    e2e:
      - script: tests/e2e/work_ci_test.sh
        step: "2. a Work Item is created through the API"
      - script: tests/e2e/agent_test.sh
        step: "3. a Work Item is created for it"

  S-5/TestEngineeringRunProof:
    status: covered
    note: >-
      TestEngineeringRunProof opens an agent-authored run with
      agentrun.OpenEngineeringRun (what agent-runtime calls when an Agent Run
      succeeds) against a real repository in the real git service, then reads
      through the REST API: the agent and model behind it, the plan (the Work
      Item's criteria), change impact from the real diff since the merge base
      (seen red at three files with a two-point diff) with its risk and
      reason, and per-gate proof. The agent-runtime call site itself runs only
      after a real model run and is proven by no test here; the proof is
      recorded through RecordProof rather than a gate evaluation.
    go_tests:
      - ./internal/edge TestEngineeringRunProof
      - ./internal/reviews TestAssessRiskSaysWhy
      - ./internal/reviews TestProofRecordsAccumulate
      - ./internal/reviews TestReviewVerdictsRecordedAsProof
      - ./internal/reviews TestComputeImpactCountsFiles
      - ./internal/reviews TestCreateRunOverGRPC

  S-5/TestSelfApprovalRejected:
    status: covered
    note: >-
      The merge-refusal test uses a user author rather than an agent; the
      agent-author case is asserted at SubmitReview and reviewer selection.
    go_tests:
      - ./internal/reviews TestAuthorCannotBeSoleApprover
      - ./internal/reviews TestAuthorAgentExcludedFromReviewers
      - ./internal/reviews TestMergeRequiresIndependentApproval
      - ./internal/reviews TestSecondReviewerApproves

  S-6/TestRunnerJobStreamAndArtifact:
    status: covered
    note: >-
      TestRunnerJobStreamAndArtifact runs the whole path over a real gRPC
      server on a local listener: the runner's own Session receives the job
      from the pump on its Connect stream, streams LogChunks, and GetJobLogs
      returns the first line while the job is provably still running; the
      finished log is sealed into MinIO and the artifact downloads byte for
      byte, and not for another organization. The job runs through
      LocalExecutor, which shares the pod executor's live output filter
      (TestJobOutputReachesTheLogWhileTheJobRuns); a pod job itself is proven
      only by work_ci_test.sh, whose live-log and download steps were written
      in this change and have not yet been run against the cluster.
    go_tests:
      - ./internal/ci TestRunnerJobStreamAndArtifact
      - ./internal/runner TestJobOutputReachesTheLogWhileTheJobRuns
      - ./internal/edge TestDownloadArtifactServesTheFile
      - ./internal/edge TestDownloadArtifactReportsAbsence
      - ./internal/ci TestPumpHandsAPendingJobToAConnectedRunner
      - ./internal/ci TestSealMovesLogToObjectStorage
      - ./internal/runner TestArtifactsRoundTripThroughOutput
    e2e:
      - script: tests/e2e/work_ci_test.sh
        step: "5. pushing a workflow schedules a CI run"
      - script: tests/e2e/work_ci_test.sh
        step: "6. the job log is readable while the job runs"
      - script: tests/e2e/work_ci_test.sh
        step: "8. the job log and artifact are retrievable"
      - script: tests/e2e/work_ci_test.sh
        step: "9. the artifact's content downloads through the API"
      - script: tests/e2e/work_ci_test.sh
        step: "7. the run reaches a terminal state"

  S-6/TestAgentCIJob:
    status: covered
    go_tests:
      - ./internal/ci TestAgentCIJob
      - ./internal/ci TestAgentCIJobWithNoAgentForRoleFails
      - ./internal/ci TestAgentCIJobWithoutSponsorFails
      - ./internal/ci TestParseWorkflowWithAgentJob
    e2e:
      - script: tests/e2e/agent_ci_test.sh
        step: "3. the agent job starts an Agent Run"
      - script: tests/e2e/agent_ci_test.sh
        step: "4. the job settles with the run's outcome"
      - script: tests/e2e/agent_ci_test.sh
        step: "5. the review is on the record"

  S-7/TestAgentRunIsolationAndEvidence:
    status: covered
    note: >-
      The spec-named test runs against the real cluster (KUBE_CONTEXT) and
      skips without it: it observes the run's namespace and network policy,
      works inside the pod, destroys the namespace and observes it gone, then
      reads back the commit, audit entry, stored state and terminal state
      event. The run is driven by the test, not by agent-runtime's
      ExecuteFunc, whose provision/destroy wiring is exercised only by
      agent_test.sh.
    go_tests:
      - ./internal/workspace TestAgentRunIsolationAndEvidence
      - ./internal/workspace TestCreateMakesNamespacedPod
      - ./internal/workspace TestCreateAppliesDenyAllNetworkPolicy
      - ./internal/workspace TestDestroyRemovesNamespace
      - ./internal/workspace TestReapRemovesOrphanedNamespaces
      - ./internal/agentrun TestLoopRecordsEvidenceNotReasoning
    e2e:
      - script: tests/e2e/agent_test.sh
        step: "6. the run is on the record with its capability grant"
      - script: tests/e2e/agent_test.sh
        step: "7. the agent actually did the work"

  S-7/TestRunBudgetHardStop:
    status: covered
    note: >-
      Each of wall-clock (a model call that never returns), tokens and cost
      (accrued from a configured token price) stops Loop.Execute; the run is
      settled through agents.SettleRun, the path agent-runtime uses, and its
      over_budget state, end reason, spend, tool call and summary are read
      back from the real store and audit log. A cost limit is refused at
      StartRun when no price is configured. Not run on the cluster: the
      deployed chart prices no model, so no e2e step exercises cost.
    go_tests:
      - ./internal/agentrun TestRunBudgetHardStop
      - ./internal/agents TestStartRunRefusesCostLimitWithoutPrice
      - ./internal/agentrun TestLoopStopsOnBudget
      - ./internal/agents TestWallclockExceeded
      - ./internal/agents TestTokenLimitExceeded
      - ./internal/agents TestCostLimitExceeded
      - ./internal/tools TestBudgetCheckedBeforeCall

  S-7/TestAgentBranchLockedDuringRun:
    status: covered
    note: >-
      StartRun's background start takes the lock (BranchLock.Acquire); the
      spec-named test drives it, then pushes with unmodified git clients over
      HTTPS and SSH through git-platform's real newCapFunc, which asks a real
      agent-runtime gRPC server over a service token. A person is refused
      under the run's prefix, the run's agent is not, CreateBranch and
      CreateCommit are refused too, and pushes are accepted after CancelRun.
      Orphaned runs are settled and released. The e2e step is written but has
      not yet been run against the cluster.
    go_tests:
      - ./cmd/git-platform TestAgentBranchLockedDuringRun
      - ./cmd/git-platform TestBranchLockFailsClosed
      - ./internal/agents TestOrphanedRunIsSettledAndReleasesItsLock
      - ./internal/agents TestHumanPushRejectedWhileLocked
      - ./internal/agents TestAcquireThenSecondAcquireFails
    e2e:
      - script: tests/e2e/agent_test.sh
        step: "4a. a person's push to the agent's branch is refused while the run holds it"

  S-8/TestToolCallAudited:
    status: covered
    note: >-
      Registry.Call records each call's arguments and its outcome for
      successful, failing, denied, unknown, over-budget and cancelled calls.
      The argument evidence contract is per argument (tools.AuditArgs): a
      built-in tool's identifiers — repository, ref, path, symbol, work item —
      are kept verbatim, while an argument declared as content, an argument
      past the length bound, and every argument of a tool whose schema this
      repository does not define are kept as their length and sha256. That
      satisfies the criterion's argument-level requirement without the audit
      log becoming a copy of whatever an agent was handed. No e2e step reads
      the audit log; the coverage here is the Go tests.
    go_tests:
      - ./internal/tools TestToolCallAudited
      - ./internal/tools TestAuditArgsDisclosesIdentifiersAndDigestsContent
      - ./internal/tools TestCancelledCallStillRecordsItsOutcome
      - ./internal/tools TestEveryCallIsAudited
      - ./internal/agents TestRecordThenComplete
      - ./internal/agents TestArgsStoreOnlyObservableMetadata
      - ./internal/agents TestFailedCallRetainsError

  S-9/TestAirGappedAgentRun:
    status: covered
    note: >-
      Runs complete against the cluster's FastLLM-served model (agent_test,
      agent_ci_test). TestAirGappedAgentRun renders the chart and requires the
      model and embedding endpoints to be in-cluster service addresses and every
      service but gates and work-reviews (whose scanners fetch vulnerability and
      module data) to carry a CiliumNetworkPolicy admitting only the cluster and
      the Kubernetes API. airgap_test.sh proves it from inside the running
      agent-runtime pod's network: the gateway answers, api.openai.com,
      api.anthropic.com and 1.1.1.1 do not. The gateway's own upstream
      configuration is FastLLM's, outside this repository.
    go_tests:
      - ./internal/agentrun TestNewModelClientPassesProviderThrough
      - ./internal/service TestAirGappedAgentRun
    e2e:
      - script: tests/e2e/agent_test.sh
        step: "5. the run reaches a terminal state"
      - script: tests/e2e/airgap_test.sh
        step: "1. agent-runtime reaches the in-cluster model gateway"
      - script: tests/e2e/airgap_test.sh
        step: "2. agent-runtime reaches nothing outside the cluster"

  S-10/TestGateBlocksMerge:
    status: covered
    note: >-
      TestGateBlocksMerge runs the merge path as deployed — identity,
      git-platform, reviews and gates as real gRPC servers behind the real
      svcauth interceptor — and merges through reviews.MergeRun and the
      production GatesClient. An agent-authored run whose change fails its
      required tests gate (real go test on the change's head) is refused with
      an independent approval present, main does not move, and the same run
      merges once the change is fixed. Writing it exposed that gates evaluated
      the target branch, not the change. Not run on the cluster in this change.
    go_tests:
      - ./internal/gates TestGateBlocksMerge
      - ./internal/reviews TestMergeBlockedByFailingGate
      - ./internal/gates TestMayMergeFalseWhenGateFails
      - ./internal/gates TestMayMergeFalseWhenGateMissing
      - ./internal/gates TestMayMergeFalseWhenEvaluationIsStale
      - ./internal/reviews TestAllApprovalsStillRequireGates

  S-10/TestGateConfigSelfEditRejected:
    status: covered
    note: >-
      Definitions are read from the target ref, so a change cannot weaken the
      gates judging itself; and any change touching .novaforge/gates (weakening
      required, deleting a file, or proposed through ProposeGateChange) raises
      a change_gate_config approval that MayMerge enforces through
      Merger.Merge until an owner or admin who is not the author approves it
      for the change's current head. Author, member and agent decisions are
      refused. Not run on the cluster in this change.
    go_tests:
      - ./internal/gates TestGateConfigSelfEditRejected
      - ./internal/gates TestGateConfigEditedInSourceIgnored
      - ./internal/gates TestResolveReadsFromTargetRefNotSource
      - ./internal/gates TestChangedPathsReadsHeadersNotContent

  S-10/TestGateControllerUnreachableBlocks:
    status: covered
    note: >-
      Unreachability is a stub checker returning Unavailable, not a dead gRPC
      connection; the adapter that passes the error through is trivial.
    go_tests:
      - ./internal/reviews TestMergeBlockedWhenControllerUnreachable

  S-11/TestApprovalPaths:
    status: covered
    note: >-
      The gate controller classifies each run's diff (merge-base) and decides
      each governed action with approvals.Decide, whose inputs are the policy,
      the action found in repository content and a capability-free grant —
      never run titles, plans or other model output (a misleading title is
      part of the test). Adding a dependency follows the policy path (no
      person asked, dependencies gate made required, decision recorded as
      proof); a schema change needs an owner/admin approval bound to the head,
      denial blocks, a later push needs a new approval. Deploying to staging
      or production has no action in this platform, so only Decide's rule is
      asserted for it (TestDeployProductionForbiddenWithoutGrant). The
      approvals inbox is exercised by gui_test.sh only as an endpoint that
      answers. Not run on the cluster in this change.
    go_tests:
      - ./internal/gates TestApprovalPaths
      - ./internal/gates TestManifestParsersFindEveryDeclaredDependency
      - ./internal/gates TestSchemaPaths
      - ./internal/approvals TestChangeDBSchemaRequiresArchitectureApproval
      - ./internal/approvals TestDeployProductionForbiddenWithoutGrant
      - ./internal/approvals TestPolicyIsNotDerivedFromModelOutput
      - ./internal/approvals TestRulesMatchDecide
      - ./internal/gates TestResolveApprovalRequiresOrgScope

  S-12/TestShortLivedCredential:
    status: covered
    note: >-
      The ci-runner pump asks the gates broker over real gRPC, as a service,
      for a single-use lease per declared secret at dispatch; the job receives
      the value in secret_env (a Kubernetes Secret in its pod), the lease is
      spent and expires within 15 minutes, a staging job asking for a
      production-only secret fails naming production, and a production job
      gets production material only on the default branch. The value is
      masked in the stored log. The credential is minted by the configured
      dynamic provider, not the stored secret handed back: the broker refuses
      to issue at all when no provider binding covers the organization,
      environment and name. secrets_test.sh proves this on the cluster — a job
      receives a credential whose name nothing is stored under, the credential
      does not appear in the stored log, and a lease is recorded for the job.
      It is a separate suite because a binding is operator-owned and read at
      startup, so it cannot exist for the throwaway organization the other
      suites create.
    go_tests:
      - ./internal/ci TestShortLivedCredential
      - ./internal/ci TestJobLogNeverCarriesItsCredential
      - ./internal/runner TestPodReceivesCredentialsFromASecret
      - ./internal/gates TestSecretsAreWriteOnlyAndBrokeredOnlyToCI
      - ./internal/secrets TestLeaseExpires
      - ./internal/secrets TestProductionSecretDeniedToStagingGrant
      - ./internal/secrets TestRedeemedTokenIsSingleUse
      - ./internal/secrets TestCrossRunRedeemDenied
    e2e:
      - script: tests/e2e/work_ci_test.sh
        step: "4. a secret is registered through the API, and no read returns it"
      - script: tests/e2e/secrets_test.sh
        step: "5. the job runs and reports what it got"
      - script: tests/e2e/secrets_test.sh
        step: "6. the credential is masked in the stored log, and its lease is recorded"

  S-12/TestBrokerDownFailsClosed:
    status: covered
    note: >-
      With the gates server stopped, the production pump leaves a
      credential-needing job pending and undispatched, blocked with a reason
      naming the broker and held back from re-claim for a while, and still
      dispatches a credential-free job to the same runner. A refusal (as
      opposed to an outage) fails the job.
    go_tests:
      - ./internal/ci TestBrokerDownFailsClosed
      - ./internal/ci TestCredentialFreeJobRunsWhenBrokerDown
      - ./internal/ci TestCredentialJobBlocksWhenBrokerDown
      - ./internal/ci TestJobStaysQueuedNotFailed

  S-13/TestMCPServerOperations:
    status: covered
    note: >-
      get_work_item, search_repository, create_branch and get_gate_status
      succeed over stdio and over Streamable HTTP (2025-06-18 transport rules
      enforced: Origin, MCP-Protocol-Version, 401 challenge) through
      mcp.PlatformBackend — the backend mcp-server runs, moved from
      cmd/mcp-server — against real in-process identity, git-platform,
      work-reviews, gates and engineering-graph; the created branch is read
      back through git-platform. Search is answered lexically: the test
      indexer's embedding model is a fixed-vector double. Approved external
      servers are now consumed: agent-runtime offers their tools per run.
      Not yet run against the cluster's mcp-server.
    go_tests:
      - ./internal/mcp TestMCPServerOperations
      - ./internal/mcp TestStreamableHTTPTransportRules
      - ./internal/mcp TestClientSpeaksStreamableHTTP
      - ./internal/mcp TestListApprovedServersOffersOnlyApproved
      - ./internal/tools TestApprovedExternalMCPServersAreOfferedToAgents
      - ./internal/mcp TestToolsListReturnsExactlySeven
      - ./internal/mcp TestStreamableHTTPRoundTrip
      - ./internal/mcp TestInitializeAdvertisesCurrentProtocolVersion
      - ./internal/mcp TestCallToolIsOrgScoped

  S-14/TestGraphQueries:
    status: covered
    note: >-
      A push through the real git service is indexed into real Postgres and the
      graph's own RPCs answer, for a symbol, what depends on it, which test
      functions cover it and which Work Item last changed it (named by the
      commit message or merged agent branch), and those edges stay correct as
      either end is re-indexed. "Which services depend on it" is answered at
      the resolution the index has: the depending symbols and files, and the
      files importing its package. Edges are extracted for Go only; Python,
      Java and TypeScript files get symbols and chunks but no edges.
      graph_test.sh has not yet been run against the cluster.
    go_tests:
      - ./internal/indexing TestPushWritesDependencyTestAndChangeEdges
      - ./internal/graph TestDependentsAnswersForSymbol
      - ./internal/graph TestTestsCoveringAnswersForSymbol
      - ./internal/graph TestLastChangedByReturnsWorkItem
    e2e:
      - script: tests/e2e/graph_test.sh
        step: "3. the symbol's dependents, tests and last change come from the push"
      - script: tests/e2e/graph_test.sh
        step: "4. a file's imports and importers"

  S-15/TestIndexUpdatedOnPush:
    status: covered
    note: >-
      A push publishes its event (merges, commits and branch creations made
      through git-platform publish the same event), and the indexer, reading
      through the real git service with a service credential, replaces the
      symbols, chunks and dependency edges of exactly the changed files of the
      repository's default branch; a push to any other branch leaves the index
      alone. search_test.sh and graph_test.sh have not yet been run against
      the cluster.
    go_tests:
      - ./internal/gitops TestPushOverHTTPPublishesEvent
      - ./internal/gitops TestMergeRPCPublishesPushEvent
      - ./internal/gitops TestCreateCommitAndBranchRPCsPublishPushEvents
      - ./internal/indexing TestRunConsumesPushEventsAndAcks
      - ./internal/indexing TestFirstPushIsIndexedThroughTheRealGitService
      - ./internal/indexing TestIndexesOnlyChangedPaths
      - ./internal/indexing TestDeletedFileRemovesSymbols
      - ./internal/indexing TestParseRecordsReferences
      - ./internal/indexing TestPushWritesDependencyTestAndChangeEdges
      - ./internal/indexing TestIndexFollowsTheDefaultBranchOnly
    e2e:
      - script: tests/e2e/search_test.sh
        step: "3. the push is indexed with embeddings"
      - script: tests/e2e/graph_test.sh
        step: "5. a feature branch does not rewrite the default branch's index"

  S-16/TestContextBounded:
    status: covered
    note: >-
      Proven at the component against real Postgres with a fake git client.
      The production adapter (ctxasm.NewAssembleFunc) is driven through the
      AssembleContext RPC by agentrun's TestKnowledgeRecall, which also bounds
      the brief it lands in.
    go_tests:
      - ./internal/ctxasm TestBundleRespectsTokenBudget
      - ./internal/ctxasm TestBundleExcludesUnrelatedFiles
      - ./internal/ctxasm TestStaleIndexDegradesNotFails
      - ./internal/agentrun TestKnowledgeRecall

  S-17/TestKnowledgeRecall:
    status: covered
    note: >-
      One run records a decision with knowledge.record through the real graph
      service; a later related run's opening brief — prepared by the Runner
      agent-runtime calls, through AssembleContext over gRPC on real Postgres —
      carries it, and an unrelated run's does not. The model is an in-process
      double that records what it was sent. Knowledge is recalled by text and,
      where an embedding model answers, by meaning; the cluster run is not yet
      proven.
    go_tests:
      - ./internal/agentrun TestKnowledgeRecall
      - ./internal/ctxasm TestKnowledgeIsIncluded
      - ./internal/knowledge TestRecordAndSearch
      - ./internal/graph TestRecordAndSearchKnowledgeWithoutEmbedderDegrades
    e2e:
      - script: tests/e2e/graph_test.sh
        step: "6. recorded knowledge is listed and found"

  S-18/TestRepoConfigGoverns:
    status: covered
    note: >-
      Gates are governed by .novaforge/gates from the target ref and malformed
      gate config fails closed. Agent runs are governed by .novaforge at the
      default branch's head, through the real git service: the agent
      definition's tools are the only ones offered or callable, its model is
      requested and its budget applied, project.yaml and context documents are
      in the brief, and a malformed definition fails the run before any model
      call with the parse error as its recorded summary.
    go_tests:
      - ./internal/agentrun TestRepoConfigGoverns
      - ./internal/tools TestRestrictRemovesUnlistedTools
      - ./internal/gates TestResolveReadsFromTargetRefNotSource
      - ./internal/gates TestMalformedGateConfigFailsClosed
      - ./internal/gates TestUnknownGateNameRejected
      - ./internal/repoconfig TestMalformedConfigFailsLoudly
      - ./internal/repoconfig TestUnknownAgentToolRejected

  S-19/TestSwarmDependencyOrder:
    status: covered
    note: >-
      The spec-named test asserts every started subtask got the agent for its
      role, and that a subtask whose run ended over budget is blocked by the
      scheduler (from Scheduler.RunOutcome, not a test SetState), blocking the
      epic and keeping its dependents from starting. work-reviews' RunOutcome
      is tested against a real agent-runtime gRPC server. The failure path has
      not been exercised on the cluster.
    go_tests:
      - ./internal/swarm TestSwarmDependencyOrder
      - ./cmd/work-reviews TestSwarmReadsRunOutcomeFromAgentRuntime
      - ./internal/swarm TestDecomposeProducesOrderedSubtasks
      - ./internal/swarm TestMaterialiseCreatesChildWorkItems
      - ./internal/swarm TestTickStartsOnlyReadySubtasks
      - ./internal/swarm TestFailedPrerequisiteBlocksDependents
      - ./internal/work TestFailedBlockerKeepsDependentsBlocked
    e2e:
      - script: tests/e2e/factory_test.sh
        step: "2. an epic decomposes into dependency-ordered subtasks"
      - script: tests/e2e/factory_test.sh
        step: "3. only dependency-free subtasks are startable"

  S-20/TestMaintenanceProposesWorkItem:
    status: covered
    note: >-
      TestMaintenanceProposesWorkItem runs the sweep production builds
      (maintenance.NewSweeper): a repository holding golang.org/x/text v0.3.0
      is served by the real git service over gRPC, the organization (which has
      no Work Item) is found through git-platform's platform-worker RPC, the
      real osv-scanner runs on the tree read through the service, and the
      proposal is a security Work Item with no assignee awaiting approval. The
      sweep is confined to the test's organization after asserting the
      unfiltered list names it, because the dev database is shared. Only the
      cve kind is exercised end to end. factory_test.sh step 5 was written in
      this change and has not yet been run against the cluster.
    go_tests:
      - ./internal/maintenance TestMaintenanceProposesWorkItem
      - ./internal/svcauth TestPlatformTokenNamesNoOrganization
      - ./internal/svcauth TestInterceptorAdmitsThePlatformWorker
      - ./internal/maintenance TestCVEScannerFindsAKnownVulnerability
      - ./internal/maintenance TestProposalCreatesUnassignedWorkItem
      - ./internal/maintenance TestProposalNeverStartsAnAgentRun
    e2e:
      - script: tests/e2e/factory_test.sh
        step: "5. a vulnerable dependency produces a proposed Work Item that nothing executes"

  S-21/TestOpenAPICoverage:
    status: covered
    note: Compared at method and path; operation schemas and parameters are not.
    go_tests:
      - ./internal/edge TestEveryRouteIsInOpenAPI
      - ./internal/edge TestRouterMountsEveryRoute
      - ./internal/edge TestEveryRouteHasAHandlerWhenWired

  S-21/TestCLIFullLifecycle:
    status: covered
    note: >-
      One test drives nf through login, org create/add-member, repo create
      and clone, a plain git push, work create with acceptance and a required
      gate, agent create/start/get, run create, run gates (evaluated, pass),
      run proof, a refused self-approval and unreviewed merge, an independent
      review and run merge, then reads main back — against the real REST edge
      and services in process. Registration is not an nf command.
      cli_test.sh runs the same on the cluster but has not yet been run there.
    go_tests:
      - ./internal/cli TestCLIFullLifecycle
      - ./internal/cli TestRepoCreateAndList
      - ./internal/cli TestLoginPersistsToken
    e2e:
      - script: tests/e2e/cli_test.sh
        step: "4. nf opens an Engineering Run and inspects its gates"
      - script: tests/e2e/cli_test.sh
        step: "6. nf merges and main carries the change"

  S-22/TestHelmDeploy:
    status: covered
    note: >-
      The chart is rendered with the helm binary and every values.yaml service
      must have a Deployment running its own binary, a Service, and every
      environment variable its binary's type-checked package reads without
      defaulting (skipped only where helm is absent). On the cluster the
      expected Deployments are rendered from the release's own values and must
      all exist and be ready, readiness being /healthz. The expected-set part
      of step 1 was written in this change and has not yet been run against
      the cluster. Agent runs as pods in per-run namespaces are S-7's evidence.
    go_tests:
      - ./internal/service TestHelmChartDeploysEveryServiceWithTheEnvironmentItsBinaryReads
    e2e:
      - script: tests/e2e/deploy_test.sh
        step: "1. every deployment reports ready"
      - script: tests/e2e/deploy_test.sh
        step: "2. edge answers readiness"
  S-23/TestAgentActivityReported:
    status: covered
    note: >-
      ListAgentActivity reports every agent in the organization with the run it
      is executing and that run's Work Item key, or as idle when it holds none,
      and an agent whose run has ended is idle again. The key is read from the
      run's own frozen work_item_snapshot, so activity is answerable without
      reading the Work service's schema. ListAgents carries the activity with
      each agent, so a roster is one request rather than a client
      cross-referencing runs, and the edge always emits the fields so an idle
      agent is stated rather than inferred from an absent value. No e2e step
      reads the roster; the coverage here is the Go tests.
    go_tests:
      - ./internal/agents TestAgentActivityReported
      - ./internal/agents TestAgentActivityIsOrganizationScoped
  S-23/TestWorkCompletedTodayCounted:
    status: covered
    note: >-
      A trigger records when a Work Item reached done and clears it when the item
      leaves done, so a reopened item is not counted as finished and a
      recompleted one counts once for its latest completion; items already done
      before the migration stay unrecorded rather than back-dated.
      CompletedSince counts within a window and is organization scoped, and it
      lives in work because that is where the items are — reviews computes the
      rest of the dashboard from runs in its own schema. The edge asks the Work
      service for the UTC day and reports the count as unavailable rather than
      zero when it cannot answer, because zero would read as "nothing was done".
    go_tests:
      - ./internal/work TestDoneAtRecordsWhenAnItemCompleted
      - ./internal/work TestCompletedSinceCountsOnlyItemsThatAreDoneNow
      - ./internal/work TestCompletedSinceIsOrganizationScoped
  S-24/TestWebhookDelivered:
    status: partial
    note: >-
      A push delivers a signed POST and the delivery is recorded with the endpoint's
      response status; a hook whose endpoint always fails is retried to a bound and
      then left failed rather than retried forever, and the message is acked so a pod
      restart does not re-deliver to a broken endpoint. The worker is a Redis consumer
      group and TestGitPlatformStartsTheDeliveryWorker asserts cmd/git-platform starts
      it — verified red by unstarting it. Mutation-checked: signing body+0x27 and
      ignoring the retry bound each make the corresponding test fail.

      Partial, not covered: S-24 names pushes, Engineering Runs and CI results, and
      only pushes are delivered. Neither an Engineering Run nor a CI result is
      published on any stream today, and StreamRunsDeleted carries run ids with no
      repository, so there is nothing routable to a repository's hooks. Closing this
      needs a publisher in internal/ci and work-reviews.

      Also unproven on the cluster: nothing was built or deployed, and git-platform is
      listed under networkPolicy.airGapped, so in the deployed configuration a hook
      reaches an in-cluster endpoint and a public-internet endpoint is dropped by
      Cilium.
    go_tests:
      - ./internal/webhooks TestWebhookDelivered
      - ./internal/webhooks TestWebhookRetriesAreBounded
      - ./internal/webhooks TestGitPlatformStartsTheDeliveryWorker
      - ./internal/webhooks TestHooksAreScopedToTheirOrganization
  S-24/TestWebhookSecretNeverReadBack:
    status: covered
    note: >-
      A hook's secret can be set and rotated and no read returns either value: the Hook
      type carries no secret field at all, rather than one every caller must remember
      not to render, and a read reports only whether a secret is present. Stored under
      AES-GCM with the same key derivation the secret broker uses, and an empty KEK
      refuses to store a secret rather than deriving a key from the empty string. The
      signature a receiver verifies is computed over the exact delivered body —
      mutation-checked by signing body+0x27, which fails the test.
    go_tests:
      - ./internal/webhooks TestWebhookSecretNeverReadBack
  S-25/TestLFSRoundTrip:
    status: partial
    note: >-
      An unmodified git-lfs client pushes a 5 MiB file over HTTP and a fresh clone
      retrieves it byte for byte. The proof that the payload is not in the git
      directory is that the whole bare repository is under 1 MiB afterwards — random
      data does not compress, so that is evidence rather than an assertion about
      pointers.

      Partial: LFS is served over HTTP only. There is no git-lfs-authenticate on the
      SSH transport, so a clone that reaches the platform over ssh:// will not fetch
      LFS objects. The batch verify operation and non-basic transfer adapters are
      refused with a 422 saying so rather than implemented.

      Also unproven on the cluster, and deleting a repository or organization leaves
      its LFS payloads in the bucket — the rows cascade, the objects do not, which
      matches the pre-existing behaviour for release assets.
    go_tests:
      - ./internal/gitops TestLFSRoundTrip
  S-25/TestLFSQuotaAndOwnership:
    status: covered
    note: >-
      An upload declaring more than NF_LFS_MAX_OBJECT_BYTES is refused before any
      bytes are stored, a transfer exceeding it is refused at the transport, a body
      that does not hash to its oid is refused, and another organization's credential
      reaches nothing. LFS is served by the same handler, AuthFunc and CapFunc as the
      git transport, so the grant, branch-lock, archive and collaborator-role guards
      apply to it unmodified — an upload is authorized as a write against the ref the
      client declared, which is what pushing is.

      The config field has no default in LoadConfig deliberately: a default makes the
      chart guard treat the variable as optional, and it could then vanish from the pod
      unnoticed. The 5 GiB fallback lives in the store, so a missing variable is bounded
      rather than unbounded.

      The blob key is scoped by organization and repository rather than content-addressed
      by oid alone. Nothing pinned that until
      TestLFSBlobKeyIsScopedToItsRepository — stripping the scoping broke no other test,
      because what refuses a request is the org-scoped row lookup, so the key is
      defence in depth that needed its own guard.
    go_tests:
      - ./internal/gitops TestLFSQuotaAndOwnership
      - ./internal/gitops TestLFSBlobKeyIsScopedToItsRepository
  S-26/TestRepositoryAdministration:
    status: covered
    note: >-
      Rename, default branch, archive and transfer, each applied only when the
      caller asked for it so a partial update does not silently reset what it did
      not mention. A repository's directory is root/<org>/<name>.git, so rename and
      transfer move files as well as rows: each moves the directory then commits
      and moves it back if the commit fails. Changing the default branch sets the
      repository's own HEAD, and refuses a branch that does not exist. Archiving
      refuses writes over both transports through the CapFunc they already share,
      proven red-green — with the guard unwired an archived repository accepts a
      real push.
    go_tests:
      - ./internal/gitops TestRepositoryAdministration
      - ./cmd/git-platform TestArchivedRepositoryRefusesAPush
  S-26/TestRepositoryCollaborator:
    status: covered
    note: >-
      A person who is not a member of an organization can be granted one repository in
      it and reaches only that repository, proven over the real HTTP transport with an
      unmodified git client: no grant cannot clone, the granted repository clones and
      pushes, a second repository in the same organization is refused, a read grant
      cannot push, and revoking removes access. A grant may name a team, which is what
      makes teams load-bearing.

      Identity refused a non-member at credential resolution, so it now resolves one
      when the Git transports ask and reports org_member false with an empty role. The
      resulting scope is repository-limited, and authz.RequireOrg refuses it — so the
      35 files that authorize on the organization alone fail closed without being
      edited, because one missed call site there is a data leak rather than a bug.

      Two defects this uncovered. CapFunc's contract said it is called with no refs for
      git-upload-pack "where it may still deny read access" and it was not: reads were
      gated by membership alone, so a credential confined to one repository would have
      cloned every repository in the organization over both transports. And the team
      lookup presented no credential, so every collaborator failed to authenticate,
      which made the negative cases pass for the wrong reason until the positive case
      exposed it.

      A collaborator can neither grant nor list grants. ResolveUsername answers one
      exact username or NotFound and only for an owner, an admin or an org-scoped
      service, because a looser lookup lets any authenticated account enumerate users.

      Not proven on the cluster: no e2e suite and no nf CLI support.
    go_tests:
      - ./cmd/git-platform TestOutsideCollaboratorReachesOnlyItsRepository
      - ./internal/gitops TestRepositoryCollaboratorGrants
      - ./internal/authz TestRepoLimitedScopeIsRefusedByRequireOrg
  S-27/TestImportFromRemote:
    status: partial
    note: >-
      An imported repository carries the remote's commits, branches and tags. The
      clone lands in a throwaway directory moved into place only once complete, so a
      failed import leaves no row and no directory — verified red by removing the
      cleanup. That assertion had to be strengthened: git removes its own target
      directory when a clone fails, so the obvious test passed with no cleanup at all;
      what catches the leak is a clone that succeeds and an insert that is then
      refused as a duplicate name.

      Partial, not covered: git-platform is in the chart's networkPolicy.airGapped,
      so its egress is cluster-only and an import from GitHub or a public Gitea fails
      at connect until an operator removes it from that list. Import works from an
      in-cluster remote. values.yaml was deliberately left alone — that is the
      operator's trade-off. The code is deployed at dc5f70f, but no e2e suite exercises
      import or mirroring and nf has no import command, so nothing has imported a
      repository on the cluster.
    go_tests:
      - ./internal/gitops TestImportFromRemote
  S-27/TestMirrorRefresh:
    status: covered
    note: >-
      A mirror picks up a new upstream commit when the mirrorer runs, and a push to a
      mirror is refused naming upstream as the owner of its history — refused through
      newCapFunc, so both the HTTP and SSH transports are covered from one place.

      The upstream credential reaches git through GIT_ASKPASS, never argv, a file or a
      URL; validateRemote refuses a remote carrying userinfo rather than stripping it,
      so a pasted token is reported and can be revoked. It is stored AES-GCM under the
      service KEK, and the test greps the stored remote and credential columns, the
      value read back through GetMirror, the mirrorer's log on a failing refresh and
      the recorded last_error — verified red by storing it in plain text.

      The seam is asserted, not assumed: TestGitPlatformStartsTheMirrorer type-checks
      cmd/git-platform and insists on a call to (*gitops.Mirrorer).Run, because a
      mirror nobody refreshes presents as silence — an imported repository that never
      changes, indistinguishable from an upstream nobody has pushed to. Verified red
      by replacing the goroutine with "_ = mirrorer".

      Not proven on the cluster: the code is deployed at dc5f70f, but no e2e suite
      refreshes a mirror, so the mirrorer has never been observed running in a pod.
    go_tests:
      - ./internal/gitops TestMirrorRefresh
      - ./internal/gitops TestMirrorCredentialIsEncryptedAndNeverLogged
      - ./internal/gitops TestGitPlatformStartsTheMirrorer
  S-28/TestReleaseWithAssets:
    status: covered
    note: >-
      A release exists only on a tag the repository actually has, asked of git
      rev-parse rather than of a table; an asset downloads byte for byte; deleting a
      release removes its blobstore objects, verified gone from MinIO rather than
      merely unrowed. Keys are org-scoped
      (org/<org>/repo/<repo>/release/<release>/<asset>) and two organizations sharing a
      repository name, tag and asset name get different keys. Download streams at the
      store, RPC and edge layers — verified red by widening the chunk, which reports
      the asset "sent in 1 message(s): it is being buffered, not streamed". The
      recorded size is what arrived rather than what the uploader claimed.

      Not proven on the cluster: the blobstore construction, the stream interceptor and
      the novaforge-releases bucket are deployed at dc5f70f but exercised by no e2e
      suite, and platformtest starts git-platform without a release store.
    go_tests:
      - ./internal/gitops TestReleaseWithAssets
      - ./internal/gitops TestReleaseAssetKeysAreOrgScoped
      - ./internal/gitops TestReleaseAssetStreamsThroughTheRPC
  S-29/TestGitOverHTTPS:
    status: covered
    note: >-
      A clone and a push complete over HTTPS, including by the certificate's DNS name;
      a plaintext request on the TLS port is refused; an unreadable keypair refuses at
      construction rather than serving without TLS; and a renewed certificate is
      picked up without a restart — verified red by loading the keypair once, which is
      what a naive implementation does and what would break every clone at renewal.
      TestChartTLSPortMatchesTheServedPort pins the chart's port to the served one.

      Proven on the cluster at dc5f70f (helm revision 9): step 4b of
      tests/e2e/deploy_test.sh cloned and pushed 1e67201 over HTTPS to
      novaforge-git-platform.novaforge.svc:8443, verifying the chain against the
      certificate's own DNS name with sslVerify on and cert-manager's issuing CA, and
      a plaintext request on the TLS port was refused. This step had been written and
      never executed until then.

      Both clauses of the criterion — an unmodified git client over HTTPS against the
      served certificate, and a refused plaintext attempt — are proven, so this is
      covered. Beyond the criterion: certificate renewal has not been observed in a
      pod. The Go test proves the server reloads a renewed keypair without a restart,
      and was seen red with a load-once keypair; no deployment has yet lived through
      cert-manager actually rotating it.
    go_tests:
      - ./internal/gitops TestCloneAndPushOverHTTPS
      - ./internal/gitops TestCloneOverHTTPSByTheCertificateDNSName
      - ./internal/gitops TestPlaintextRequestOnTheTLSPortIsRefused
      - ./internal/gitops TestNewTLSServerRefusesAnUnreadableKeypair
      - ./internal/gitops TestTLSServerPicksUpARenewedCertificate
    e2e:
      - script: tests/e2e/deploy_test.sh
        step: "4b. the same clone and push work over HTTPS, and plaintext on the TLS port is refused"
  S-30/TestForkAndCrossForkRun:
    status: partial
    note: >-
      A fork carries the parent's history, records its parent id, and a push to the
      fork leaves the parent's refs unchanged. It is a real clone with no alternates,
      and its origin remote is removed — a bare clone leaves a remote whose refspec
      lets a plain git fetch overwrite the fork's own refs from upstream.

      A cross-fork run merges through the one existing merge path: mergeRefs gained a
      single sourceRepoPath parameter and fetches the fork's ref into the throwaway
      clone, never into the bare target, which would publish a ref before any gate had
      authorized it. Verified red by dropping SourceRepo from the MergeRequest.

      Gate authority is the criterion that mattered most and the one the first test
      did not earn: refusal alone does not distinguish "the parent's gate was not
      satisfied" from "the gates could not be read at all", and naming the fork as the
      run's repository still refused the merge. The test now requires the refusal to
      name the gate the PARENT declared. Resolve is given the target branch's SHA
      rather than a ref name, so definitions are pinned by content address and a fork
      cannot substitute its own.

      The default is pinned at the layer that can regress it. Removing
      COALESCE(source_repo_id, repo_id) from both read queries broke no test, because
      the Go-side default masked it; the case it protects is a rolling deploy where an
      older binary inserts a run without the column, and a nil source repository makes
      the gate lookup resolve a repository that does not exist.

      Partial, not covered: a cross-fork run cannot SATISFY a gate that reads the
      change's tree, because a gate runner materializes the workspace from the target
      repository, where a fork's objects are absent until the merge fetches them. Such
      a run is refused, never waved through. Forking into another organization is
      refused outright. The code is deployed at dc5f70f, but no e2e suite forks a
      repository and nf has no fork command, so no fork has been made on the cluster.
    go_tests:
      - ./internal/gitops TestForkCarriesHistoryAndIsolatesWrites
      - ./internal/reviews TestCrossForkRun
      - ./internal/reviews TestRunWithNoSourceRepositoryReadsAsItsOwn
  S-31/TestTeamAccess:
    status: covered
    note: >-
      Teams are named groups inside an organization carrying a role, which the
      spec has claimed in S-1 and its Data section since the beginning with nothing
      implementing them. A team's role is its own and bounds its members: a team
      granting "member" grants that much to an owner too, because a narrower grant
      that widened to its strongest member would not be narrower. Names are unique
      per organization, so two organizations may each have a "reviewers" team.
      Adding someone twice succeeds and does not duplicate, so a caller retrying
      after a lost response is not told a failure. A person must already belong to
      the organization: a team is a narrower grant within it, not a way into it.
    go_tests:
      - ./internal/identity TestTeamAccess
