# Source: novaforge/templates/datastores.tpl
apiVersion: apps/v1
kind: Deployment
metadata: {name: novaforge-postgres}
spec:
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  replicas: 1
  selector: {matchLabels: {app: novaforge-postgres}}
  template:
    metadata: {labels: {app: novaforge-postgres}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - {name: POSTGRES_USER, value: novaforge}
            - name: POSTGRES_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: novaforge-secrets
                  key: POSTGRES_PASSWORD
            - {name: POSTGRES_DB, value: novaforge}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe:
            exec: {command: [pg_isready, -U, novaforge]}
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: novaforge-pg-data}
---
# Source: novaforge/templates/datastores.tpl
apiVersion: apps/v1
kind: Deployment
metadata: {name: novaforge-redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: novaforge-redis}}
  template:
    metadata: {labels: {app: novaforge-redis}}
    spec:
      # The image's redis user. Without fsGroup a fresh block volume (OKE's
      # oci-bv) is root-owned and Redis cannot create its append-only dir;
      # the image's entrypoint only fixes ownership when it starts as root,
      # which a restricted node runtime need not allow.
      securityContext: {runAsUser: 999, runAsGroup: 999, fsGroup: 999}
      containers:
        - name: redis
          image: redis:8
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 5
      volumes:
        - name: data
          # Writable by the redis user, and it survives a container restart,
          # which the image layer did not.
          emptyDir: {}
---
