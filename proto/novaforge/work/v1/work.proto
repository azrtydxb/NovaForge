syntax = "proto3";

package novaforge.work.v1;

import "google/protobuf/field_mask.proto";

// WorkService manages Work Items: typed engineering intent that can be
// assigned to a human or an agent. Every RPC derives its organization from
// the caller's resolved scope, never from a field of the request message.
service WorkService {
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  rpc AssignItem(AssignItemRequest) returns (AssignItemResponse);
  rpc PatchItem(PatchItemRequest) returns (PatchItemResponse);
  rpc TransitionItem(TransitionItemRequest) returns (TransitionItemResponse);
  rpc ClaimExecution(ClaimExecutionRequest) returns (ClaimExecutionResponse);
  rpc ReleaseExecution(ReleaseExecutionRequest) returns (ReleaseExecutionResponse);
  rpc ListSubtasks(ListSubtasksRequest) returns (ListSubtasksResponse);
  rpc DecomposeEpic(DecomposeEpicRequest) returns (DecomposeEpicResponse);
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc ListMaintenanceProposals(ListMaintenanceProposalsRequest) returns (ListMaintenanceProposalsResponse);
  rpc ApproveMaintenanceProposal(ApproveMaintenanceProposalRequest) returns (ApproveMaintenanceProposalResponse);
  rpc DismissMaintenanceProposal(DismissMaintenanceProposalRequest) returns (DismissMaintenanceProposalResponse);
  rpc ScanRepository(ScanRepositoryRequest) returns (ScanRepositoryResponse);
}

// WorkItem mirrors a row in the work.work_items table.
message WorkItem {
  string id = 1;
  string org_id = 2;
  string repo_id = 3;
  string key = 4;
  string type = 5;
  string goal = 6;
  repeated string acceptance = 7;
  repeated string constraints = 8;
  repeated string required_gates = 9;
  string assignee_id = 10;
  string assignee_kind = 11;
  string state = 12;
  string created_at = 13;
  // awaiting_approval marks a maintenance proposal no person has approved.
  // Such an item must not be executed: agent-runtime refuses to start a run
  // against it.
  bool awaiting_approval = 14;
  // Scanner-owned intent remains immutable even after approval.
  bool maintenance_proposal = 15;
  // Historical admission: intent is no longer unstarted even after release.
  bool execution_claimed = 16;
}

message CreateItemRequest {
  string repo_id = 1;
  string type = 2;
  string goal = 3;
  repeated string acceptance = 4;
  repeated string constraints = 5;
  repeated string required_gates = 6;
}

message CreateItemResponse {
  WorkItem item = 1;
}

// GetItemRequest identifies a Work Item by id or by its human-readable key
// (e.g. "NF-1"). Exactly one of the two must be set.
message GetItemRequest {
  string id = 1;
  string key = 2;
}

message GetItemResponse {
  WorkItem item = 1;
}

message ListItemsRequest {
  string repo_id = 1;
  string state = 2;
}

message ListItemsResponse {
  repeated WorkItem items = 1;
}

message AssignItemRequest {
  string id = 1;
  string assignee_id = 2;
  string assignee_kind = 3;
}

message AssignItemResponse {
  WorkItem item = 1;
}

message Subtask {
  WorkItem item = 1;
  // ready reports whether every blocker of this subtask is done. The caller
  // should not recompute it from the dependency list: readiness is a single
  // query against the same transaction the scheduler uses.
  bool ready = 2;
}

message ListSubtasksRequest {
  string epic_key = 1;
}
message ListSubtasksResponse {
  repeated Subtask subtasks = 1;
}

message DecomposeEpicRequest {
  string epic_key = 1;
}
message DecomposeEpicResponse {
  repeated WorkItem subtasks = 1;
}

// Comment is one entry in a Work Item's discussion thread. author_kind is
// "user" or "agent", so a reader can always tell which wrote a line.
message Comment {
  string id = 1;
  string work_item_id = 2;
  string author_id = 3;
  string author_kind = 4;
  string body = 5;
  string created_at = 6;
}

message AddCommentRequest {
  string work_item_id = 1;
  string body = 2;
}
message AddCommentResponse {
  Comment comment = 1;
}

message ListCommentsRequest {
  string work_item_id = 1;
}
message ListCommentsResponse {
  repeated Comment comments = 1;
}

// MaintenanceProposal is a scanner finding that became a Work Item. resolved
// marks a finding that has stopped reproducing. decision is empty until a
// person approves or dismisses it.
message MaintenanceProposal {
  string fingerprint = 1;
  string work_item_key = 2;
  string work_item_goal = 3;
  string work_item_type = 4;
  string state = 5;
  bool resolved = 6;
  string decision = 7;
  string decided_by = 8;
  string decided_at = 9;
  string dismiss_reason = 10;
  string assignee_id = 11;
  string assignee_kind = 12;
}

// ApproveMaintenanceProposalRequest approves a proposal and assigns its Work
// Item. With no assignee the approver takes it; otherwise assignee_kind is
// "user" or "agent".
message ApproveMaintenanceProposalRequest {
  string repo_id = 1;
  string fingerprint = 2;
  string assignee_id = 3;
  string assignee_kind = 4;
}
message ApproveMaintenanceProposalResponse {
  MaintenanceProposal proposal = 1;
}

// DismissMaintenanceProposalRequest declines a proposal, closing its Work
// Item. reason is required: a dismissal nobody can later understand is
// indistinguishable from one made by mistake.
message DismissMaintenanceProposalRequest {
  string repo_id = 1;
  string fingerprint = 2;
  string reason = 3;
}
message DismissMaintenanceProposalResponse {
  MaintenanceProposal proposal = 1;
}

// ScanRepositoryRequest runs every maintenance scanner against a repository's
// default branch now, instead of waiting for the next sweep.
message ScanRepositoryRequest {
  string repo_id = 1;
}
// ScanRepositoryResponse reports what the scan found. scanner_errors names
// each scanner that could not run and why: a scan that silently skipped the
// CVE scanner is not a clean bill of health.
message ScanRepositoryResponse {
  int32 findings = 1;
  repeated string proposed_work_item_keys = 2;
  repeated string scanner_errors = 3;
}

message ListMaintenanceProposalsRequest {
  string repo_id = 1;
}
message ListMaintenanceProposalsResponse {
  repeated MaintenanceProposal proposals = 1;
}

// Only type, goal, acceptance, constraints and required_gates may be patched.
// expected carries the previously read values of all five fields, so a stale
// editor cannot silently replace another person's changes.
message PatchItemRequest {
  string id = 1;
  string repo_id = 2;
  WorkItem values = 3;
  WorkItem expected = 4;
  google.protobuf.FieldMask update_mask = 5;
}
message PatchItemResponse {
  WorkItem item = 1;
}
message TransitionItemRequest {
  string id = 1;
  string repo_id = 2;
  string expected_state = 3;
  string to_state = 4;
}
message TransitionItemResponse {
  WorkItem item = 1;
}

// Only the verified org-scoped agent-runtime service may call these RPCs.
// Persist run_id before calling; replay the same binding after an uncertain
// result. Active exact retries return the original immutable intent. Released
// identities cannot be reused. No claim expires on a wall clock.
message ClaimExecutionRequest {
  string work_item_id = 1;
  string repo_id = 2;
  string run_id = 3;
  string agent_id = 4;
  // Runtime-validated initiating human, retained for audit, not authorization.
  string sponsor_id = 5;
}
message ClaimExecutionResponse {
  // Use this snapshot for both execution and verification, never GetItem later.
  WorkItem item = 1;
}
message ReleaseExecutionRequest {
  string work_item_id = 1;
  string repo_id = 2;
  string run_id = 3;
  // succeeded -> review; failed/cancelled/over_budget -> blocked.
  // admission_failed -> open only for an existing claim; if absent it writes
  // a cancellation tombstone without changing the Work Item.
  string outcome = 4;
  // Only admission_failed requires true. The runtime must have durably fenced
  // this run terminal with no execution begun and no live execution authority
  // BEFORE asserting this; an ambiguous admission must remain claimed.
  bool no_execution_started = 5;
  // Binds cancellation tombstones even when ClaimExecution never arrived.
  string agent_id = 6;
}
message ReleaseExecutionResponse {}
