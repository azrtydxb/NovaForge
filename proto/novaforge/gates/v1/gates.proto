syntax = "proto3";

package novaforge.gates.v1;

// GatesService is the sole authority on merge eligibility: gate evaluation,
// human approvals, and short-lived secret leases. Every RPC derives its
// organization from the caller's resolved scope, never from a field of the
// request message.
service GatesService {
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
  rpc MayMerge(MayMergeRequest) returns (MayMergeResponse);
  rpc ListEvaluations(ListEvaluationsRequest) returns (ListEvaluationsResponse);
  rpc ListCoverageHistory(ListCoverageHistoryRequest) returns (ListCoverageHistoryResponse);
  rpc RequestApproval(RequestApprovalRequest) returns (RequestApprovalResponse);
  rpc ResolveApproval(ResolveApprovalRequest) returns (ResolveApprovalResponse);
  rpc IssueLease(IssueLeaseRequest) returns (IssueLeaseResponse);
  rpc RedeemLease(RedeemLeaseRequest) returns (RedeemLeaseResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc ListLeases(ListLeasesRequest) returns (ListLeasesResponse);
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);
  rpc IssueJobLease(IssueJobLeaseRequest) returns (IssueJobLeaseResponse);
  rpc RevokeLease(RevokeLeaseRequest) returns (RevokeLeaseResponse);
  rpc RevokeRunLeases(RevokeRunLeasesRequest) returns (RevokeRunLeasesResponse);
  rpc RetryCredentialRevocations(RetryCredentialRevocationsRequest) returns (RetryCredentialRevocationsResponse);
  rpc ListGateConfig(ListGateConfigRequest) returns (ListGateConfigResponse);
  rpc ProposeGateChange(ProposeGateChangeRequest) returns (ProposeGateChangeResponse);
}

message Evaluation {
  string id = 1;
  string org_id = 2;
  string run_id = 3;
  string gate = 4;
  string status = 5;
  string detail = 6;
  string target_sha = 7;
  string evaluated_at = 8;
  // Absent for legacy evaluations, failed tests or unavailable measurements.
  optional double coverage_percent = 9;
  string repo_id = 10;
}

message ListCoverageHistoryRequest {
  string repo_id = 1;
}
message ListCoverageHistoryResponse {
  // Latest two recorded tests-gate head evaluations, newest first. Unavailable
  // measurements remain present; callers must not skip them for older values.
  repeated Evaluation evaluations = 1;
}

message EvaluateRequest {
  string run_id = 1;
}

message EvaluateResponse {
  repeated Evaluation evaluations = 1;
}

message MayMergeRequest {
  string run_id = 1;
  string expected_source_sha = 2;
  string expected_target_sha = 3;
}

message MayMergeResponse {
  bool allowed = 1;
  repeated string reasons = 2;
  string evaluated_source_sha = 3;
  string evaluated_target_sha = 4;
}

message ListEvaluationsRequest {
  string run_id = 1;
}

message ListEvaluationsResponse {
  repeated Evaluation evaluations = 1;
}

message ApprovalRequestMsg {
  string id = 1;
  string org_id = 2;
  string run_id = 3;
  string action = 4;
  string detail_json = 5;
  // decision is pending, approved, denied, or superseded (the change moved
  // on after the request was raised, so it no longer describes the head).
  string decision = 6;
  string decided_by = 7;
  string decided_at = 8;
  string created_at = 9;
  // head_sha is the commit of the change the request is about. An approval
  // counts only for this head: a later push needs a new decision.
  string head_sha = 10;
  // reason says in words why the platform asked, derived from the diff.
  string reason = 11;
  // paths are the changed files that made the request necessary.
  repeated string paths = 12;
  string comment = 13;
  string author_id = 14;
  string author_kind = 15;
}

message ListApprovalsRequest {
  // run_id, when set, lists every request for that run in any state;
  // otherwise the organization's pending requests are listed.
  string run_id = 1;
}

message ListApprovalsResponse {
  repeated ApprovalRequestMsg requests = 1;
  // can_decide reports whether the caller holds a role that may decide
  // approvals, so a screen offers the buttons only to someone whose click
  // would be allowed. The decision itself is checked again when made.
  bool can_decide = 2;
  // viewer_id is the caller, so a screen can say "you authored this" rather
  // than offering a decision the service will refuse.
  string viewer_id = 3;
}

message RequestApprovalRequest {
  string run_id = 1;
  string action = 2;
  string detail_json = 3;
}

message RequestApprovalResponse {
  ApprovalRequestMsg request = 1;
}

message ResolveApprovalRequest {
  string id = 1;
  // decided_by was taken from the request, so a caller could record a
  // decision under anyone's name. The decider is the caller.
  reserved 2;
  reserved "decided_by";
  string decision = 3;
  string comment = 4;
}

message ResolveApprovalResponse {
  bool ok = 1;
  ApprovalRequestMsg request = 2;
}

// PutSecretRequest registers or replaces a secret's value. The value is
// write-only: no RPC returns it to a person.
message PutSecretRequest {
  string name = 1;
  string environment = 2;
  string value = 3;
}

message PutSecretResponse {
  SecretReference secret = 1;
}

// IssueJobLeaseRequest asks the broker for one secret on behalf of a CI job.
// Only a platform service may ask. The grant the lease is issued under is
// derived by the broker from the job's declared environment and its commit's
// branch, never supplied by the caller.
message IssueJobLeaseRequest {
  string job_id = 1;
  string repo_id = 2;
  // ref is the ref the CI run was scheduled for.
  string ref = 3;
  // environment is the job's declared environment: staging or production.
  string environment = 4;
  string name = 5;
  int64 ttl_seconds = 6;
  // A fresh identifier for each all-or-nothing credential resolution attempt.
  string attempt_id = 7;
}

message IssueJobLeaseResponse {
  string lease_id = 1;
  // token is redeemed once, by the same job, through RedeemLease.
  string token = 2;
  string name = 3;
  string expires_at = 4;
  string environment = 5;
}

message IssueLeaseRequest {
  string run_id = 1;
  string grant_id = 2;
  string name = 3;
  int64 ttl_seconds = 4;
}

message IssueLeaseResponse {
  string lease_id = 1;
  string token = 2;
  string name = 3;
  string expires_at = 4;
}

message RedeemLeaseRequest {
  string run_id = 1;
  string token = 2;
}

message RedeemLeaseResponse {
  string value = 1;
}

// SecretReference names a stored secret without any of its material.
message SecretReference {
  string name = 1;
  string environment = 2;
}

message ListSecretsRequest {}
message ListSecretsResponse {
  repeated SecretReference secrets = 1;
}

// Lease is one brokered credential as an operator sees it. The token is not
// carried: only its hash is stored, and even that is never returned.
message Lease {
  string id = 1;
  string secret_name = 2;
  string run_id = 3;
  string state = 4;
  string expires_at = 5;
}

message ListLeasesRequest {}
message ListLeasesResponse {
  repeated Lease leases = 1;
}

message RevokeLeaseRequest {
  string id = 1;
}
message RevokeLeaseResponse {
  bool revoked = 1;
}

// GateConfig is one gate the platform understands, as a repository's default
// branch declares it. A gate with no file under .novaforge/gates is still
// listed, undeclared, so a screen can offer to turn it on.
message GateConfig {
  string name = 1;
  // declared is whether a file under .novaforge/gates names this gate.
  bool declared = 2;
  // enabled is the file's `required` flag: an enabled gate blocks a merge
  // until it passes; a declared but disabled one is evaluated as advice.
  bool enabled = 3;
  string path = 4;
  // params_json is the file's params mapping, JSON-encoded; "{}" when none.
  string params_json = 5;
}

message ListGateConfigRequest {
  string repo = 1;
}

message ListGateConfigResponse {
  // ref is the branch the configuration was read from: the default branch.
  string ref = 1;
  string commit_sha = 2;
  repeated GateConfig gates = 3;
}

// ProposeGateChangeRequest asks for a change to one gate. The change is never
// written to the default branch: it is committed to a new branch and opened
// as an Engineering Run, so weakening a gate is itself reviewed.
message ProposeGateChangeRequest {
  string repo = 1;
  string gate = 2;
  // enabled, when set, becomes the gate file's `required` flag.
  optional bool enabled = 3;
  // params_json, when non-empty, replaces the gate's params with this JSON
  // object.
  string params_json = 4;
}

message ProposeGateChangeResponse {
  string run_id = 1;
  int32 run_number = 2;
  string branch = 3;
  string commit_sha = 4;
  string title = 5;
}

// Empty attempt_id closes the entire run permanently; otherwise only the
// failed attempt is fenced, permitting a new attempt to retry the job.
message RevokeRunLeasesRequest {
  string run_id = 1;
  string attempt_id = 2;
}
message RevokeRunLeasesResponse {
  bool fenced = 1;
  int32 pending = 2;
}
message RetryCredentialRevocationsRequest {}
message RetryCredentialRevocationsResponse {}
