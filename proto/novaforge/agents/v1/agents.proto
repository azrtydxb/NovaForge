syntax = "proto3";

package novaforge.agents.v1;

import "novaforge/identity/v1/identity.proto";

// AgentService manages agent identities and their runs: isolated,
// budget-bounded executions against a Work Item, with a live event stream
// of state changes and tool calls. Every RPC derives its organization from
// the caller's resolved scope, never from a field of the request message.
service AgentService {
  rpc GetGrantIntent(GetGrantIntentRequest) returns (GetGrantIntentResponse);
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  rpc StreamRunEvents(StreamRunEventsRequest) returns (stream StreamRunEventsResponse);
  rpc ListStats(ListStatsRequest) returns (ListStatsResponse);
  rpc ListToolCalls(ListToolCallsRequest) returns (ListToolCallsResponse);
  rpc ListRunsForWorkItem(ListRunsForWorkItemRequest) returns (ListRunsForWorkItemResponse);
  rpc CheckBranchLock(CheckBranchLockRequest) returns (CheckBranchLockResponse);
}

message Agent {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string role = 4;
  string model_ref = 5;
  bool enabled = 6;
}

message CreateAgentRequest {
  string name = 1;
  string role = 2;
  string model_ref = 3;
  bool enabled = 4;
}

message CreateAgentResponse {
  Agent agent = 1;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message Run {
  string id = 1;
  string org_id = 2;
  string agent_id = 3;
  string work_item_id = 4;
  string sponsor_id = 5;
  string grant_id = 6;
  string branch = 7;
  string state = 8;
  string started_at = 9;
  string ended_at = 10;
  int64 wallclock_limit_seconds = 11;
  int64 token_limit = 12;
  int64 cost_limit_micros = 13;
  // What the run spent, recorded when it ends.
  int64 tokens_used = 14;
  int64 cost_used_micros = 15;
  // Why a run that did not succeed ended: which budget limit stopped it, or
  // what failed. Empty for a run still going or one that succeeded.
  string end_reason = 16;
  bool tokens_available = 17;
  bool cost_available = 18;
  bool grant_cleanup_pending = 19;
  string grant_cleanup_error = 20;
  bool work_release_pending = 21;
  string work_release_error = 22;
  bool workspace_cleanup_pending = 23;
  string workspace_cleanup_error = 24;
  bool execution_finished = 25;
  string repo_id = 26;
}

// StartRunRequest starts a new agent run against a Work Item, identified by
// its human-readable key (e.g. "NF-1"). sponsor_id must name a human
// member of the organization: an agent run started with no human sponsor
// is refused.
message StartRunRequest {
  string agent_id = 1;
  string repo_id = 2;
  string work_item_key = 3;
  string sponsor_id = 4;
  int64 wallclock_limit_seconds = 5;
  int64 token_limit = 6;
  int64 cost_limit_micros = 7;
}

message StartRunResponse {
  Run run = 1;
}

message GetRunRequest {
  string id = 1;
}

message GetRunResponse {
  Run run = 1;
}

message CancelRunRequest {
  string id = 1;
}

message CancelRunResponse {
  bool ok = 1;
}

message StreamRunEventsRequest {
  string run_id = 1;
}

// RunEvent is one message on the run's event stream: either a state change
// or a recorded tool call.
message StreamRunEventsResponse {
  string run_id = 1;
  string at = 2;
  oneof payload {
    StateChange state_change = 3;
    ToolCall tool_call = 4;
  }
}

message StateChange {
  string from_state = 1;
  string to_state = 2;
}

// ToolCall is one tool call an agent run made — carried live on the run
// event stream, and read back afterwards from the audit log. The later
// fields are empty on a live event, which reports a call as it happens
// rather than a completed record of one.
message ToolCall {
  string tool = 1;
  string outcome = 2;
  string args = 3;
  string error = 4;
  string started_at = 5;
}

// AgentStats is one agent's run history: how many runs it started, how they
// ended, and what they spent.
message AgentStats {
  string agent_id = 1;
  int32 runs = 2;
  int32 succeeded = 3;
  int32 failed = 4;
  int32 over_budget = 5;
  int32 running = 6;
  int64 tokens_used = 7;
  int64 token_limit = 8;
}

message ListStatsRequest {}
message ListStatsResponse {
  repeated AgentStats stats = 1;
}

message ListToolCallsRequest {
  string run_id = 1;
}
message ListToolCallsResponse {
  repeated ToolCall calls = 1;
}

message ListRunsForWorkItemRequest {
  string work_item_id = 1;
}
message ListRunsForWorkItemResponse {
  repeated string run_ids = 1;
  // runs carries the same runs, newest first, so a caller showing them does
  // not make one GetRun per id.
  repeated Run runs = 2;
}

// CheckBranchLockRequest asks whether a ref in a repository of the caller's
// organization is held by a running Agent Run. The git transports ask before
// accepting a push: the lock is the run being "running", and that state lives
// in this service's schema, which no other service may read.
message CheckBranchLockRequest {
  string repo_id = 1;
  // ref is a branch name, with or without "refs/heads/".
  string ref = 2;
}

message CheckBranchLockResponse {
  bool locked = 1;
  // The holding run, its agent, and the branch prefix the lock covers (the
  // run's capability grant prefix, e.g. "agents/NF-1/"). Empty when unlocked.
  string run_id = 2;
  string agent_id = 3;
  string prefix = 4;
}

// Only Identity's org-scoped service credential may inspect this receipt.
message GetGrantIntentRequest { string run_id = 1; }
message GetGrantIntentResponse { novaforge.identity.v1.GrantIntent intent = 1; }
