syntax = "proto3";

package novaforge.git.v1;

// GitService owns bare repository storage and read access to their contents.
// Authentication is delegated to the identity service; every request is
// answered only within the caller's organization.
service GitService {
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse);
  rpc GetRepo(GetRepoRequest) returns (GetRepoResponse);
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc DeleteRepo(DeleteRepoRequest) returns (DeleteRepoResponse);
  rpc UpdateRepo(UpdateRepoRequest) returns (UpdateRepoResponse);
  rpc TransferRepo(TransferRepoRequest) returns (TransferRepoResponse);
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc ListCommits(ListCommitsRequest) returns (ListCommitsResponse);
  rpc GetTree(GetTreeRequest) returns (GetTreeResponse);
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);
  rpc GetDiff(GetDiffRequest) returns (GetDiffResponse);
  rpc Merge(MergeRequest) returns (MergeResponse);
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);
  rpc CreateCommit(CreateCommitRequest) returns (CreateCommitResponse);
  rpc CreateHook(CreateHookRequest) returns (CreateHookResponse);
  rpc ListHooks(ListHooksRequest) returns (ListHooksResponse);
  rpc DeleteHook(DeleteHookRequest) returns (DeleteHookResponse);
  rpc SetHookSecret(SetHookSecretRequest) returns (SetHookSecretResponse);
  rpc ListHookDeliveries(ListHookDeliveriesRequest) returns (ListHookDeliveriesResponse);
  // ListOrganizationsWithRepositories is a platform-worker RPC: it answers
  // only a caller presenting a platform token (svcauth.MintPlatform), and only
  // with organization ids. The worker re-enters each organization's scope with
  // an org-scoped token before reading anything in it.
  rpc ListOrganizationsWithRepositories(ListOrganizationsWithRepositoriesRequest) returns (ListOrganizationsWithRepositoriesResponse);
  rpc CreateRelease(CreateReleaseRequest) returns (CreateReleaseResponse);
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
  rpc DeleteRelease(DeleteReleaseRequest) returns (DeleteReleaseResponse);
  // UploadReleaseAsset and DownloadReleaseAsset stream in both directions. A
  // release asset is a build output, routinely hundreds of megabytes, so neither
  // side can hold one in a single message: gRPC's default limit is 4 MiB, and
  // raising it would only move the point at which the service runs out of memory
  // serving concurrent downloads.
  rpc UploadReleaseAsset(stream UploadReleaseAssetRequest) returns (UploadReleaseAssetResponse);
  rpc DownloadReleaseAsset(DownloadReleaseAssetRequest) returns (stream DownloadReleaseAssetResponse);
  rpc ImportRepo(ImportRepoRequest) returns (ImportRepoResponse);
  rpc GetMirror(GetMirrorRequest) returns (GetMirrorResponse);
  rpc SetMirror(SetMirrorRequest) returns (SetMirrorResponse);
  rpc DeleteMirror(DeleteMirrorRequest) returns (DeleteMirrorResponse);
}

message ListOrganizationsWithRepositoriesRequest {}
message ListOrganizationsWithRepositoriesResponse {
  repeated string org_ids = 1;
}

message Repo {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string default_branch = 4;
  bool archived = 5;
  // Set when this repository was forked from another (task 8); empty otherwise.
  string parent_repo_id = 6;
}

message Ref {
  string name = 1;
  string sha = 2;
  string kind = 3;
}

message Commit {
  string sha = 1;
  string message = 2;
  string author_name = 3;
  string author_email = 4;
  string at = 5;
}

message TreeEntry {
  string mode = 1;
  string kind = 2;
  string sha = 3;
  string name = 4;
  int64 size = 5;
}

message CreateRepoRequest {
  string name = 1;
}
message CreateRepoResponse {
  Repo repo = 1;
}

// Administration of an existing repository. Each field is applied only when the
// caller asked for it: a rename that also reset the default branch because the
// field was empty would be a silent change nobody requested. Booleans need an
// explicit set flag for the same reason — false is indistinguishable from unset.
message UpdateRepoRequest {
  string repo = 1;
  string name = 2;
  string default_branch = 3;
  bool archived = 4;
  bool set_archived = 5;
}
message UpdateRepoResponse {
  Repo repo = 1;
}
// Moving a repository to another organization. The receiving organization is a
// request field because it is the caller's intent; the sending organization comes
// from the credential, and the caller must administer both.
message TransferRepoRequest {
  string repo = 1;
  string to_org = 2;
}
message TransferRepoResponse {
  Repo repo = 1;
}

message GetRepoRequest {
  string name = 1;
}
message GetRepoResponse {
  Repo repo = 1;
}

message ListReposRequest {}
message ListReposResponse {
  repeated Repo repos = 1;
}

message DeleteRepoRequest {
  string name = 1;
}
message DeleteRepoResponse {
  bool ok = 1;
}

message ListBranchesRequest {
  string repo = 1;
}
message ListBranchesResponse {
  repeated Ref refs = 1;
}

message ListTagsRequest {
  string repo = 1;
}
message ListTagsResponse {
  repeated Ref refs = 1;
}

message ListCommitsRequest {
  string repo = 1;
  string ref = 2;
  int32 limit = 3;
}
message ListCommitsResponse {
  repeated Commit commits = 1;
}

message GetTreeRequest {
  string repo = 1;
  string ref = 2;
  string path = 3;
}
message GetTreeResponse {
  repeated TreeEntry entries = 1;
}

message GetBlobRequest {
  string repo = 1;
  string ref = 2;
  string path = 3;
}
message GetBlobResponse {
  bytes content = 1;
}

message GetDiffRequest {
  string repo = 1;
  string from = 2;
  string to = 3;
  // merge_base diffs `to` against the point it branched from `from`
  // (git's three-dot form), so the result is only what `to` changed and not
  // what `from` gained since.
  bool merge_base = 4;
}
message GetDiffResponse {
  string unified = 1;
  // Literal paths from Git's NUL-delimited manifest, including both sides of
  // renames. Consumers must not parse display-quoted diff headers for paths.
  repeated string changed_paths = 2;
  // False on older servers: an absent manifest must not mean an empty diff.
  bool paths_complete = 3;
}

message MergeRequest {
  string repo = 1;
  string source_ref = 2;
  string target_ref = 3;
  string method = 4;
  string message = 5;
  // Mandatory for review-authorized merges. Compare atomically under the
  // repository write lock, then merge this exact source commit.
  string expected_source_sha = 6;
  // Trusted policy baseline inspected by the gate owner. Both refs are checked
  // in the same native Git transaction before publishing the merge.
  string expected_target_sha = 7;
}
message MergeResponse {
  string merge_sha = 1;
}

message CreateBranchRequest {
  string repo = 1;
  string name = 2;
  // from_ref is the branch, tag, or commit the new branch starts at. Empty
  // means the repository's default branch.
  string from_ref = 3;
}
message CreateBranchResponse {
  Ref ref = 1;
}

// FileChange is one file written by a commit. Deleting is expressed by
// setting deleted, because an empty content is a legitimate empty file.
message FileChange {
  string path = 1;
  bytes content = 2;
  bool deleted = 3;
}

message CreateCommitRequest {
  string repo = 1;
  string branch = 2;
  string message = 3;
  repeated FileChange files = 4;
  string author_name = 5;
  string author_email = 6;
}
message CreateCommitResponse {
  string sha = 1;
}

// Release is a tag published for download: a version a team hands out, with the
// files published alongside it. It is not a CI artifact — an artifact belongs to
// one job and is evidence of a run, while a release belongs to a version.
message Release {
  string id = 1;
  string repo_id = 2;
  string tag = 3;
  string name = 4;
  string body = 5;
  string created_at = 6;
  repeated ReleaseAsset assets = 7;
}

// ReleaseAsset is one downloadable file on a release. The object's storage key is
// deliberately absent: it is an internal address, and publishing it would invite
// a client to construct one.
message ReleaseAsset {
  string id = 1;
  string name = 2;
  int64 size_bytes = 3;
  string content_type = 4;
}

message CreateReleaseRequest {
  string repo = 1;
  // The tag must already exist in the repository. A release on a tag that does
  // not exist is a download link pointing at nothing.
  string tag = 2;
  string name = 3;
  string body = 4;
}
message CreateReleaseResponse {
  Release release = 1;
}

message ListReleasesRequest {
  string repo = 1;
}
message ListReleasesResponse {
  repeated Release releases = 1;
}

message DeleteReleaseRequest {
  string repo = 1;
  string tag = 2;
}
message DeleteReleaseResponse {}

// UploadReleaseAssetRequest is one frame of an upload. repo, tag, name and
// content_type are read from the first frame only; every frame carries data,
// including the first.
message UploadReleaseAssetRequest {
  string repo = 1;
  string tag = 2;
  string name = 3;
  string content_type = 4;
  bytes data = 5;
}
message UploadReleaseAssetResponse {
  ReleaseAsset asset = 1;
}

// DownloadReleaseAssetRequest addresses an asset the way a download URL does: by
// repository, tag and file name, which is unique within a release.
message DownloadReleaseAssetRequest {
  string repo = 1;
  string tag = 2;
  string name = 3;
}
message DownloadReleaseAssetResponse {
  // name, size_bytes and content_type are set on the first message only.
  string name = 1;
  int64 size_bytes = 2;
  string content_type = 3;
  bytes data = 4;
}

// --- Webhooks ---
// A webhook is an endpoint outside the platform, told when something happens in
// a repository. The shared secret is write-only: it travels in on CreateHook and
// SetHookSecret and no response carries it, so has_secret is how a reader learns
// whether one is set.
message Hook {
  string id = 1;
  string repo_id = 2;
  string url = 3;
  // The event names this hook asked for. Empty means every event.
  repeated string events = 4;
  bool active = 5;
  bool has_secret = 6;
  string created_at = 7;
}

// HookDelivery is one attempt to call one endpoint. status_code is 0 when there
// was no HTTP response at all — a refused connection, a timeout — and error then
// says why.
message HookDelivery {
  string id = 1;
  string hook_id = 2;
  string event = 3;
  int32 status_code = 4;
  string error = 5;
  int32 attempt = 6;
  string at = 7;
}

message CreateHookRequest {
  string repo = 1;
  string url = 2;
  repeated string events = 3;
  string secret = 4;
}
message CreateHookResponse {
  Hook hook = 1;
}

message ListHooksRequest {
  string repo = 1;
}
message ListHooksResponse {
  repeated Hook hooks = 1;
}

message DeleteHookRequest {
  string repo = 1;
  string id = 2;
}
message DeleteHookResponse {}

// SetHookSecretRequest rotates the shared secret. An empty secret removes it,
// which is how a hook is deliberately made unsigned again.
message SetHookSecretRequest {
  string repo = 1;
  string id = 2;
  string secret = 3;
  // active is applied only when set_active is true, for the same reason
  // UpdateRepoRequest carries its own flag: false is indistinguishable from
  // unset, and rotating a secret must not also switch the hook off.
  bool active = 4;
  bool set_active = 5;
  // set_secret distinguishes "leave the secret alone" from "remove it". Without
  // it, switching a hook off would silently strip its signature.
  bool set_secret = 6;
}
message SetHookSecretResponse {
  Hook hook = 1;
}

message ListHookDeliveriesRequest {
  string repo = 1;
  string hook_id = 2;
  int32 limit = 3;
}
message ListHookDeliveriesResponse {
  repeated HookDelivery deliveries = 1;
}

// --- Import and mirroring ---
// Importing brings a repository in from another Git host; mirroring keeps it
// following that host until the migration is finished.
//
// The upstream credential is write-only. It travels in on ImportRepo and
// SetMirror and no response carries it, so has_credential is how a reader learns
// whether one is set. remote never contains it: git's own
// https://user:token@host idiom would put a token for somebody else's host into
// this message, into a table, and into every log line that printed the URL.
message Mirror {
  string repo_id = 1;
  string remote = 2;
  // 0 means every pass of the mirrorer. A caller who says nothing gets the
  // platform's default instead, because an unset field is also 0.
  int32 interval_seconds = 3;
  // Empty when this mirror has never been refreshed since its remote last
  // changed, which is also when it is due immediately.
  string last_synced_at = 4;
  // Why the last refresh failed, scrubbed of anything secret. Empty means the
  // last refresh succeeded.
  string last_error = 5;
  bool has_credential = 6;
}

message ImportRepoRequest {
  string name = 1;
  string remote = 2;
  string credential = 3;
  // mirror keeps following upstream afterwards. Without it the import is a
  // one-off copy, the credential is not stored at all, and the repository is
  // writable like any other.
  bool mirror = 4;
  int32 interval_seconds = 5;
}
message ImportRepoResponse {
  Repo repo = 1;
  // Absent when the import was a one-off copy rather than a mirror.
  Mirror mirror = 2;
}

message GetMirrorRequest {
  string repo = 1;
}
message GetMirrorResponse {
  Mirror mirror = 1;
}

message SetMirrorRequest {
  string repo = 1;
  string remote = 2;
  // An empty credential removes the stored one, which is how a mirror of a
  // repository that has been made public is deliberately made anonymous.
  string credential = 3;
  int32 interval_seconds = 4;
}
message SetMirrorResponse {
  Mirror mirror = 1;
}

message DeleteMirrorRequest {
  string repo = 1;
}
message DeleteMirrorResponse {}
