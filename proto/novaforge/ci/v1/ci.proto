syntax = "proto3";

package novaforge.ci.v1;

// RunnerService lets a runner register once, then hold a single persistent
// outbound stream that the platform pushes jobs down — a runner never needs
// inbound network reachability.
// CIService answers questions about runs, jobs, logs and artifacts. It is
// separate from RunnerService because runners and humans are different callers
// with different authorization: a runner presents a runner credential, a person
// presents theirs.
service CIService {
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc GetJobLogs(GetJobLogsRequest) returns (GetJobLogsResponse);
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
  rpc TriggerRun(TriggerRunRequest) returns (TriggerRunResponse);
}

service RunnerService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);
  rpc UploadArtifact(UploadArtifactRequest) returns (UploadArtifactResponse);
}

message RegisterRequest {
  string org_id = 1;
  string name = 2;
  repeated string labels = 3;
}

message RegisterResponse {
  string runner_id = 1;
  string token = 2;
}

// Heartbeat carries no payload beyond its timestamp; its presence on the
// stream is what keeps the connection live.
message Heartbeat {
  string at = 1;
}

// LogChunk is one line of live job output, forwarded by the runner as it is
// produced.
message LogChunk {
  string job_id = 1;
  string line = 2;
}

// ConnectRequest is one frame a runner sends up its Connect stream, always
// naming the runner it came from.
message ConnectRequest {
  string runner_id = 1;
  oneof payload {
    Heartbeat heartbeat = 2;
    LogChunk log_chunk = 3;
  }
}

// ConnectResponse is one job pushed down a runner's Connect stream.
message ConnectResponse {
  string job_id = 1;
  string run_id = 2;
  string repo_clone_url = 3;
  string commit_sha = 4;
  string run_cmd = 5;
  string agent_role = 6;
  string image = 7;
  map<string, string> env = 8;
  repeated string artifact_paths = 9;
}

message ReportStatusRequest {
  string runner_id = 1;
  string job_id = 2;
  string status = 3;
  int32 exit_code = 4;
  string detail = 5;
}

message ReportStatusResponse {
  bool ok = 1;
}

message WorkflowRunSummary {
  string id = 1;
  string repo_id = 2;
  string commit_sha = 3;
  string ref = 4;
  string status = 5;
  string created_at = 6;
}

message WorkflowJobSummary {
  string id = 1;
  string run_id = 2;
  string name = 3;
  string status = 4;
  string detail = 5;
}

message ArtifactSummary {
  string id = 1;
  string job_id = 2;
  string name = 3;
  int64 size_bytes = 4;
}

message ListRunsRequest {
  string repo_id = 1;
}
message ListRunsResponse {
  repeated WorkflowRunSummary runs = 1;
}

message GetRunRequest {
  string id = 1;
}
message GetRunResponse {
  WorkflowRunSummary run = 1;
  repeated WorkflowJobSummary jobs = 2;
}

message GetJobLogsRequest {
  string job_id = 1;
  string run_id = 2;
}
message GetJobLogsResponse {
  repeated string lines = 1;
}

message ListArtifactsRequest {
  string run_id = 1;
  string job_id = 2;
}
message ListArtifactsResponse {
  repeated ArtifactSummary artifacts = 1;
}

message UploadArtifactRequest {
  string runner_id = 1;
  string job_id = 2;
  string name = 3;
  bytes content = 4;
}
message UploadArtifactResponse {
  string artifact_id = 1;
}

// TriggerRunRequest asks for a run of the workflow at ref, on demand rather
// than in response to a push. ref is a branch, tag, or commit; empty means
// the repository's default branch.
message TriggerRunRequest {
  string repo_id = 1;
  string ref = 2;
}
message TriggerRunResponse {
  WorkflowRunSummary run = 1;
}
