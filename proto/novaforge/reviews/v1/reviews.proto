syntax = "proto3";

package novaforge.reviews.v1;

// ReviewsService manages Engineering Runs: pull requests that carry plan and
// proof through to merge. Every RPC derives its organization from the
// caller's resolved scope, never from a field of the request message.
service ReviewsService {
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc AddPlanStep(AddPlanStepRequest) returns (AddPlanStepResponse);
  rpc RecordProof(RecordProofRequest) returns (RecordProofResponse);
  rpc SubmitReview(SubmitReviewRequest) returns (SubmitReviewResponse);
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  rpc RequestAgentReview(RequestAgentReviewRequest) returns (RequestAgentReviewResponse);
  rpc ListAgentReviewRequests(ListAgentReviewRequestsRequest) returns (ListAgentReviewRequestsResponse);
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc GetExceptions(GetExceptionsRequest) returns (GetExceptionsResponse);
  rpc ListProof(ListProofRequest) returns (ListProofResponse);
  rpc MergeRun(MergeRunRequest) returns (MergeRunResponse);
  rpc ListPlan(ListPlanRequest) returns (ListPlanResponse);
  // GetRunImpact measures a run's change — its source branch against the
  // point it diverged from its target — through the git service.
  rpc GetRunImpact(GetRunImpactRequest) returns (GetRunImpactResponse);
}

message GetRunImpactRequest {
  string run_id = 1;
  string repo_id = 2;
  int32 number = 3;
}

// GetRunImpactResponse is a run's change impact. risk is "low", "medium" or
// "high", and risk_reasons says which rule put it there, so a reader never
// has to take the level on trust.
message GetRunImpactResponse {
  int32 files_changed = 1;
  int32 insertions = 2;
  int32 deletions = 3;
  repeated string paths = 4;
  string risk = 5;
  repeated string risk_reasons = 6;
}

// Run mirrors a row in the reviews.runs table.
message Run {
  string id = 1;
  string org_id = 2;
  string repo_id = 3;
  string work_item_id = 4;
  int32 number = 5;
  string title = 6;
  string source_ref = 7;
  string target_ref = 8;
  string state = 9;
  string author_id = 10;
  string author_kind = 11;
  string agent_name = 12;
  string model_name = 13;
  string created_at = 14;
}

message CreateRunRequest {
  string repo_id = 1;
  string work_item_id = 2;
  string title = 3;
  string source_ref = 4;
  string target_ref = 5;
  string author_id = 6;
  string author_kind = 7;
  string agent_name = 8;
  string model_name = 9;
}

message CreateRunResponse {
  Run run = 1;
}

// GetRunRequest addresses a run either by its id or by the (repo_id,
// number) pair people and tools use — "run #7 on this repository" is how a
// run is referred to everywhere but the database.
message GetRunRequest {
  string id = 1;
  string repo_id = 2;
  int32 number = 3;
}

message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  string repo_id = 1;
  string state = 2;
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message AddPlanStepRequest {
  string run_id = 1;
  int32 ordinal = 2;
  string text = 3;
  string state = 4;
}

message AddPlanStepResponse {
  bool ok = 1;
}

message RecordProofRequest {
  string run_id = 1;
  string gate = 2;
  string status = 3;
  string detail = 4;
}

message RecordProofResponse {
  bool ok = 1;
}

message SubmitReviewRequest {
  string run_id = 1;
  string reviewer_id = 2;
  string reviewer_kind = 3;
  string verdict = 4;
  // The exact source commit the person inspected; a changed head is refused.
  string expected_source_sha = 5;
  string summary = 6;
}

message SubmitReviewResponse {
  bool ok = 1;
}

message AddCommentRequest {
  string run_id = 1;
  string author_id = 2;
  string author_kind = 3;
  string body = 4;
}

message AddCommentResponse {
  string id = 1;
  string created_at = 2;
}

// ExceptionSummary is the count per category a person scanning for what needs
// them would read first.
message ExceptionSummary {
  int32 agents_running = 1;
  int32 ready_to_auto_merge = 2;
  int32 need_human_review = 3;
  int32 architecture_decisions = 4;
  int32 gate_failures = 5;
  int32 agents_blocked = 6;
}

message ExceptionItem {
  string key = 1;
  string title = 2;
  string state = 3;
  string reason = 4;
}

message GetExceptionsRequest {}
message GetExceptionsResponse {
  ExceptionSummary summary = 1;
  repeated ExceptionItem items = 2;
}

// ProofRecord is one gate's recorded outcome for a run — the evidence an
// Engineering Run presents alongside its diff.
message ProofRecord {
  string gate = 1;
  string status = 2;
  string detail = 3;
  string recorded_at = 4;
  // Empty on historical rows whose producer was not authenticated.
  string producer = 5;
  string actor_id = 6;

}

message ListProofRequest {
  string run_id = 1;
  string repo_id = 2;
  int32 number = 3;
}
message ListProofResponse {
  repeated ProofRecord proof = 1;
}

// MergeRunRequest merges a run. method is "merge", "squash", or "rebase";
// empty means "merge". The gate controller is asked first, so this cannot
// merge anything the gates refuse.
message MergeRunRequest {
  string run_id = 1;
  string repo_id = 2;
  int32 number = 3;
  string method = 4;
}
message MergeRunResponse {
  string merge_sha = 1;
}

// PlanStep is one step of a run's plan — what it intended, shown next to what
// it demonstrated.
message PlanStep {
  int32 ordinal = 1;
  string text = 2;
  string state = 3;
}

message ListPlanRequest {
  string run_id = 1;
  string repo_id = 2;
  int32 number = 3;
}
message ListPlanResponse {
  repeated PlanStep steps = 1;
}

// Review is the latest durable verdict from one reviewer. Legacy rows have
// no source_sha and cannot authorize a merge.
message Review {
  string reviewer_id = 1;
  string reviewer_kind = 2;
  string verdict = 3;
  string summary = 4;
  string source_sha = 5;
  string created_at = 6;
}
message ListReviewsRequest {
  string run_id = 1;
}
message ListReviewsResponse {
  repeated Review reviews = 1;
  string current_source_sha = 2;
  // False means currency is unknown, not that durable reviews are stale.
  bool current_source_available = 3;
}

// One durable, non-replayed review attempt per role. Usage availability is
// independent of the verdict and of partial measured counters.
message AgentReviewAttempt {
  string id = 1;
  string agent_id = 2;
  string role = 3;
  string model = 4;
  string state = 5;
  string verdict = 6;
  string summary = 7;
  string error = 8;
  int64 tokens_used = 9;
  int64 cost_used_micros = 10;
  bool tokens_available = 11;
  bool cost_available = 12;
}
message AgentReviewRequest {
  string id = 1;
  string run_id = 2;
  string requested_by = 3;
  string source_sha = 4;
  string target_sha = 5;
  string state = 6;
  string detail = 7;
  string created_at = 8;
  repeated AgentReviewAttempt attempts = 9;
}
message RequestAgentReviewRequest {
  string run_id = 1;
  string expected_source_sha = 2;
}
message RequestAgentReviewResponse {
  AgentReviewRequest request = 1;
}
message ListAgentReviewRequestsRequest {
  string run_id = 1;
}
message ListAgentReviewRequestsResponse {
  repeated AgentReviewRequest requests = 1;
  bool available = 2;
}
