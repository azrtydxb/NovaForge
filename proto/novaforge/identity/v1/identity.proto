syntax = "proto3";

package novaforge.identity.v1;

// IdentityService owns users, organizations, teams, credentials and capability
// grants. No other service reads the identity schema; everything else asks
// here.
service IdentityService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc LogoutSession(LogoutSessionRequest) returns (LogoutSessionResponse);
  rpc IssueIntent(IssueIntentRequest) returns (IssueIntentResponse);
  rpc CancelIssuance(CancelIssuanceRequest) returns (CancelIssuanceResponse);
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  rpc ResolveSession(ResolveSessionRequest) returns (ResolveSessionResponse);
  rpc ResolveToken(ResolveTokenRequest) returns (ResolveTokenResponse);
  rpc ResolveFingerprint(ResolveFingerprintRequest) returns (ResolveFingerprintResponse);
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  rpc AddOrgMember(AddOrgMemberRequest) returns (AddOrgMemberResponse);
  rpc IssueGrant(IssueGrantRequest) returns (IssueGrantResponse);
  rpc GetGrant(GetGrantRequest) returns (GetGrantResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse);
  rpc GetOrg(GetOrgRequest) returns (GetOrgResponse);
  // DeleteOrg deletes an organization. Only an owner may, and only by naming
  // it twice: confirm_name must equal the organization's name. The deletion
  // is announced first, and every service removes that organization's data.
  rpc DeleteOrg(DeleteOrgRequest) returns (DeleteOrgResponse);
  rpc ListOrgMembers(ListOrgMembersRequest) returns (ListOrgMembersResponse);
  rpc AddSSHKey(AddSSHKeyRequest) returns (AddSSHKeyResponse);
  rpc ListSSHKeys(ListSSHKeysRequest) returns (ListSSHKeysResponse);
  rpc DeleteSSHKey(DeleteSSHKeyRequest) returns (DeleteSSHKeyResponse);
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc DeleteToken(DeleteTokenRequest) returns (DeleteTokenResponse);
  rpc Setup2FA(Setup2FARequest) returns (Setup2FAResponse);
  rpc Verify2FA(Verify2FARequest) returns (Verify2FAResponse);
}

message User {
  string id = 1;
  string email = 2;
  string username = 3;
  bool totp_enabled = 4;
}

message SSHKey {
  string id = 1;
  string title = 2;
  string fingerprint = 3;
}

message AccessToken {
  string id = 1;
  string name = 2;
  repeated string scopes = 3;
  string expires_at = 4;
}

message OrgMember {
  string user_id = 1;
  string username = 2;
  string role = 3;
}

message GetCurrentUserRequest {}
message GetCurrentUserResponse {
  User user = 1;
}

message ListOrgsRequest {}
message ListOrgsResponse {
  repeated Org orgs = 1;
}

message GetOrgRequest {
  string org = 1;
}
message GetOrgResponse {
  Org org = 1;
}

message DeleteOrgRequest {
  string org = 1;
  string confirm_name = 2;
}
message DeleteOrgResponse {
  Org org = 1;
}

message ListOrgMembersRequest {
  string org = 1;
}
message ListOrgMembersResponse {
  repeated OrgMember members = 1;
}

message AddSSHKeyRequest {
  string title = 1;
  string key = 2;
}
message AddSSHKeyResponse {
  SSHKey key = 1;
}

message ListSSHKeysRequest {}
message ListSSHKeysResponse {
  repeated SSHKey keys = 1;
}

message DeleteSSHKeyRequest {
  string id = 1;
}
message DeleteSSHKeyResponse {
  bool ok = 1;
}

message CreateTokenRequest {
  string name = 1;
  repeated string scopes = 2;
  int64 ttl_seconds = 3;
}
message CreateTokenResponse {
  AccessToken token = 1;
  string plaintext = 2;
}

message ListTokensRequest {}
message ListTokensResponse {
  repeated AccessToken tokens = 1;
}

message DeleteTokenRequest {
  string id = 1;
}
message DeleteTokenResponse {
  bool ok = 1;
}

message Setup2FARequest {}
message Setup2FAResponse {
  string secret = 1;
  string uri = 2;
}

message Verify2FARequest {
  string code = 1;
}
message Verify2FAResponse {
  bool enabled = 1;
}

// Subject is the authenticated caller. org_id is empty when no organization
// has been selected; an empty org_id never means "every organization".
// role is the caller's membership role in that organization ("owner",
// "admin" or "member"), set only alongside org_id: identity has just verified
// the membership, so a service deciding an owner-only action reads it here
// rather than reaching into the identity schema.
message Subject {
  string user_id = 1;
  string org_id = 2;
  string actor_kind = 3;
  repeated string scopes = 4;
  string role = 5;
}

message Grant {
  string id = 1;
  string org_id = 2;
  string subject_id = 3;
  string subject_kind = 4;
  bool repo_read = 5;
  string write_branch = 6;
  bool secrets_prod = 7;
  bool deploy_staging = 8;
  bool deploy_prod = 9;
  string expires_at = 10;
}

message Org {
  string id = 1;
  string name = 2;
}

message RegisterRequest {
  string email = 1;
  string username = 2;
  string password = 3;
}
message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  string totp_code = 3;
}
message LoginResponse {
  string session_token = 1;
  bool requires_totp = 2;
  string user_id = 3;
}

message ResolveSessionRequest {
  string token = 1;
  // Optional organization the caller is acting in, by name or id. See
  // ResolveTokenRequest.org.
  string org = 2;
}
message ResolveSessionResponse {
  Subject subject = 1;
}

message ResolveTokenRequest {
  string token = 1;
  // Optional organization the caller is acting in, by name or id. When set,
  // the response's org_id is populated only if the caller is a member, so a
  // service can derive an org scope it can trust.
  string org = 2;
}
message ResolveTokenResponse {
  Subject subject = 1;
}

message ResolveFingerprintRequest {
  string fingerprint = 1;
  // Optional organization the caller is acting in, by name or id. See
  // ResolveTokenRequest.org.
  string org = 2;
}
message ResolveFingerprintResponse {
  Subject subject = 1;
}

message CreateOrgRequest {
  string name = 1;
}
message CreateOrgResponse {
  Org org = 1;
}

// AddOrgMemberRequest adds a user to an organization. org_id may be the
// organization's id or its name; the user is named by user_id or username.
// role is one of owner, admin or member.
message AddOrgMemberRequest {
  string org_id = 1;
  string user_id = 2;
  string role = 3;
  string username = 4;
}
message AddOrgMemberResponse {
  bool ok = 1;
}

message IssueGrantRequest {
  string org_id = 1;
  string subject_id = 2;
  string subject_kind = 3;
  bool repo_read = 4;
  string write_branch = 5;
  bool secrets_prod = 6;
  bool deploy_staging = 7;
  bool deploy_prod = 8;
  int64 ttl_seconds = 9;
}
message IssueGrantResponse {
  Grant grant = 1;
}

message GetGrantRequest {
  string id = 1;
}
message GetGrantResponse {
  Grant grant = 1;
}

// Immutable identity; provenance fields are verified against the run owner.
message GrantIntent {
  string issuer_id = 1;
  string issuer_kind = 2;
  string run_id = 3;
  Grant grant = 4;
}
message IssueIntentRequest { GrantIntent intent = 1; }
message IssueIntentResponse { Grant grant = 1; }
message CancelIssuanceRequest { GrantIntent intent = 1; }
message CancelIssuanceResponse { bool ok = 1; }
message RevokeGrantRequest { string id = 1; }
message RevokeGrantResponse { bool ok = 1; }
// Revokes only the session presented in authorization metadata, never a PAT.
message LogoutSessionRequest {}
message LogoutSessionResponse { bool ok = 1; }
